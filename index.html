
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собери свой бургер</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<header class="header">
    <h1>Собери свой бургер</h1>
    <p>Создай бургер своей мечты!</p>
</header>

<main class="builder">

    <aside class="panel ingredients-panel">
        <h2>Твой бургер</h2>
        <p class="panel-description">Верхний слой отображается первым</p>

        <div id="ingredients-list" class="ingredients-list"></div>

        <div class="panel-actions">
            <button id="save-button" class="action-button save-button">Сохранить</button>
            <button id="eat-button" class="action-button eat-button">Съесть</button>
            <button id="reset-button" class="action-button reset-button">Сбросить</button>
        </div>
    </aside>

    <section class="workspace">
        <div class="workspace-title">
            <h2>Мастерская бургера</h2>
            <p>Добавляй ингредиенты и меняй их порядок</p>
        </div>

        <div class="burger-stage">
            <div id="burger-stack" class="burger-stack"></div>
        </div>

        <div class="sauce-panel">
            <h3>Выбери соус</h3>

            <div class="sauce-list">
                <button class="sauce-button ketchup" data-sauce="ketchup" type="button">
                    <span class="sauce-dish">●</span> Кетчуп
                </button>

                <button class="sauce-button mayonnaise" data-sauce="mayonnaise" type="button">
                    <span class="sauce-dish">●</span> Майонез
                </button>

                <button class="sauce-button mustard" data-sauce="mustard" type="button">
                    <span class="sauce-dish">●</span> Горчица
                </button>

                <button class="sauce-button bbq" data-sauce="bbq" type="button">
                    <span class="sauce-dish">●</span> Барбекю
                </button>

                <button class="sauce-button chili" data-sauce="chili" type="button">
                    <span class="sauce-dish">●</span> Чили
                </button>
            </div>
        </div>

        <div id="message" class="message" aria-live="polite">
            Добавь первый ингредиент!
        </div>
    </section>

    <aside class="panel catalog-panel">
        <h2>Ингредиенты</h2>
        <p class="panel-description">Нажми, чтобы добавить</p>

        <div id="catalog" class="catalog"></div>
    </aside>

</main>

</body>
</html>
