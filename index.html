<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собери свой бургер!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: Arial, sans-serif;
            background: #fff4df;
            color: #4b3024;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        h1 {
            margin: 0 0 16px;
            text-align: center;
            font-size: 28px;
        }

        h2 {
            margin: 0 0 14px;
            text-align: center;
            font-size: 18px;
        }

        .layout {
            display: grid;
            grid-template-columns: 190px minmax(0, 1fr) 190px;
            gap: 14px;
            max-width: 1500px;
            height: calc(100vh - 76px);
            min-height: 500px;
            margin: 0 auto;
        }

        .panel {
            min-width: 0;
            min-height: 0;
            padding: 12px;
            background: #fffaf0;
            border: 2px solid #e8d1aa;
            border-radius: 14px;
        }

        /* Список ингредиентов */

        .ingredients-panel {
            display: flex;
            flex-direction: column;
        }

        #ingredient-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }

        .ingredient-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px;
            background: #f8e8cb;
            border-radius: 9px;
        }

        .ingredient-item img {
            width: 55px;
            height: 55px;
            object-fit: contain;
            flex: 1;
            min-width: 0;
        }

        .ingredient-controls {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .ingredient-controls button,
        .delete-button {
            width: 28px;
            height: 27px;
            padding: 0;
            border: none;
            border-radius: 5px;
            background: #e6c79c;
            font-size: 16px;
        }

        .ingredient-controls button:hover {
            background: #d7b27d;
        }

        .delete-button {
            background: #e9a18b;
            flex-shrink: 0;
        }

        .delete-button:hover {
            background: #df8066;
        }

        /* Центральная область */

        .center-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 0;
            overflow: hidden;
        }

        .center-panel h2 {
            flex-shrink: 0;
        }

        .burger-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        #burger {
            position: relative;
            width: min(100%, 560px);
            height: 100%;
            max-height: 760px;
            flex-shrink: 0;
        }

        .burger-layer {
            position: absolute;
            left: 50%;
            width: 50%;
            height: auto;
            max-height: none;
            object-fit: contain;
            transform: translateX(-50%);
            transform-origin: center center;
            pointer-events: none;
            user-select: none;
        }

        /* Соусы внизу */

        .sauce-section {
            width: 100%;
            flex-shrink: 0;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e8d1aa;
        }

        .sauce-title {
            margin-bottom: 7px;
            text-align: center;
            font-size: 13px;
        }

        .sauces {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        .sauce-button {
            padding: 7px 9px;
            border: 1px solid #e0c49a;
            border-radius: 8px;
            background: #fff0d5;
            font-size: 13px;
        }

        .sauce-button:hover {
            background: #f2d8ac;
        }

        /* Основные кнопки */

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 9px;
            flex-shrink: 0;
        }

        .action-button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #a95d35;
            color: white;
            font-size: 14px;
        }

        .action-button:hover {
            background: #874525;
        }

        .save-button {
            background: #588044;
        }

        .save-button:hover {
            background: #41652f;
        }

        .eat-button {
            background: #d57b38;
        }

        .eat-button:hover {
            background: #b96427;
        }

        .status {
            min-height: 18px;
            margin: 7px 0 0;
            text-align: center;
            font-size: 13px;
            color: #6b513c;
            flex-shrink: 0;
        }

        /* Каталог */

        .catalog-panel {
            display: flex;
            flex-direction: column;
        }

        #catalog {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            overflow-y: auto;
        }

        .catalog-item {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100px;
            padding: 8px;
            background: #f8e8cb;
            border: 2px solid transparent;
            border-radius: 10px;
        }

        .catalog-item:hover {
            background: #f3ddb9;
            border-color: #c78a51;
        }

        .catalog-item img {
            width: 100%;
            height: 90px;
            object-fit: contain;
            pointer-events: none;
        }

        /* Анимация поедания */

        @keyframes eatBurger {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            60% {
                transform: scale(0.7) rotate(-8deg);
                opacity: 0.7;
            }

            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .eating {
            animation: eatBurger 0.8s ease-in forwards;
        }

        /* Небольшие экраны */

        @media (max-width: 900px) {
            body {
                padding: 10px;
            }

            .layout {
                grid-template-columns: 140px minmax(0, 1fr);
                height: auto;
                min-height: 0;
            }

            .center-panel {
                grid-column: 2;
                grid-row: 1 / span 2;
                min-height: 650px;
            }

            .ingredients-panel {
                grid-column: 1;
                grid-row: 1;
            }

            .catalog-panel {
                grid-column: 1;
                grid-row: 2;
            }

            #catalog {
                grid-template-columns: 1fr;
            }

            .burger-area {
                min-height: 300px;
            }

            #burger {
                height: 100%;
            }
        }

        @media (max-width: 560px) {
            h1 {
                font-size: 23px;
            }

            .layout {
                display: flex;
                flex-direction: column;
                height: auto;
            }

            .center-panel {
                order: 1;
                min-height: 75vh;
            }

            .ingredients-panel {
                order: 2;
            }

            .catalog-panel {
                order: 3;
            }

            .burger-area {
                min-height: 340px;
            }

            #burger {
                width: 100%;
            }

            #ingredient-list {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            #catalog {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .catalog-item {
                min-height: 80px;
            }

            .catalog-item img {
                height: 70px;
            }
        }
    </style>
</head>

<body>

    <h1>Собери свой бургер!</h1>

    <main class="layout">

        <!-- Список добавленных ингредиентов -->

        <section class="panel ingredients-panel">
            <h2>Состав</h2>
            <div id="ingredient-list"></div>
        </section>

        <!-- Бургер и кнопки -->

        <section class="panel center-panel">
            <h2>Твой бургер</h2>

            <div class="burger-area">
                <div id="burger"></div>
            </div>

            <div class="sauce-section">
                <div class="sauce-title">Добавить соус</div>

                <div class="sauces">
                    <button class="sauce-button" data-sauce="ketchup">
                        🍅 Кетчуп
                    </button>

                    <button class="sauce-button" data-sauce="mayo">
                        🥚 Майонез
                    </button>

                    <button class="sauce-button" data-sauce="mustard">
                        🌭 Горчица
                    </button>

                    <button class="sauce-button" data-sauce="bbq">
                        🍖 Барбекю
                    </button>

                    <button class="sauce-button" data-sauce="chili">
                        🌶️ Чили
                    </button>
                </div>
            </div>

            <div class="actions">
                <button class="action-button save-button" id="save-button">
                    Сохранить
                </button>

                <button class="action-button eat-button" id="eat-button" hidden>
                    Съесть
                </button>

                <button class="action-button" id="reset-button">
                    Заново
                </button>
            </div>

            <p class="status" id="status"></p>
        </section>

        <!-- Каталог ингредиентов -->

        <section class="panel catalog-panel">
            <h2>Ингредиенты</h2>
            <div id="catalog"></div>
        </section>

    </main>

    <script>
        const ingredients = [
            {
                name: "Нижняя булочка",
                file: "images/bottom-bun.png",
                type: "bun"
            },
            {
                name: "Котлета",
                file: "images/beef-patty.png",
                type: "patty"
            },
            {
                name: "Верхняя булочка",
                file: "images/top-bun.png",
                type: "bun"
            }
        ];

        const sauceColors = {
            ketchup: "#d62828",
            mayo: "#fff0c2",
            mustard: "#e8b923",
            bbq: "#713b24",
            chili: "#f04424"
        };

        const sauceNames = {
            ketchup: "Кетчуп",
            mayo: "Майонез",
            mustard: "Горчица",
            bbq: "Барбекю",
            chili: "Чили"
        };

        // Слои всегда хранятся снизу вверх.

        function createInitialBurger() {
            return [
                {
                    name: "Нижняя булочка",
                    file: "images/bottom-bun.png",
                    type: "bun"
                },
                {
                    name: "Котлета",
                    file: "images/beef-patty.png",
                    type: "patty"
                },
                {
                    name: "Верхняя булочка",
                    file: "images/top-bun.png",
                    type: "bun"
                }
            ];
        }

        let burgerLayers = createInitialBurger();
        let saved = false;
        let eaten = false;

        const burger = document.getElementById("burger");
        const catalog = document.getElementById("catalog");
        const ingredientList = document.getElementById("ingredient-list");
        const status = document.getElementById("status");
        const saveButton = document.getElementById("save-button");
        const eatButton = document.getElementById("eat-button");
        const resetButton = document.getElementById("reset-button");

        /*
            Настройки расположения слоёв.

            Значения задаются в процентах от высоты картинки.
            После обрезки PNG их можно подстроить отдельно.
        */

        const layerSettings = {
            bun: {
                overlap: 0.2
            },
            patty: {
                overlap: 0.2
            },
            sauce: {
                overlap: 0.2
            }
        };

        // Создание каталога.

        function renderCatalog() {
            catalog.innerHTML = "";

            ingredients.forEach(function (item) {
                const card = document.createElement("button");
                card.className = "catalog-item";
                card.type = "button";
                card.title = item.name;
                card.disabled = saved || eaten;

                const image = document.createElement("img");
                image.src = item.file;
                image.alt = item.name;

                image.onerror = function () {
                    image.style.visibility = "hidden";
                    console.warn("Не удалось загрузить изображение:", item.file);
                };

                card.appendChild(image);

                card.addEventListener("click", function () {
                    addIngredient(item);
                });

                catalog.appendChild(card);
            });
        }

        // Добавление ингредиента.

        function addIngredient(item) {
            if (saved || eaten) {
                return;
            }

            burgerLayers.push({
                name: item.name,
                file: item.file,
                type: item.type
            });

            renderBurger();
            renderIngredientList();
        }

        // Добавление соуса.

        function addSauce(sauce) {
            if (saved || eaten) {
                return;
            }

            burgerLayers.push({
                name: sauceNames[sauce],
                type: "sauce",
                color: sauceColors[sauce]
            });

            renderBurger();
            renderIngredientList();
        }

        // Отрисовка слоёв бургера.

        function renderBurger() {
            burger.innerHTML = "";

            if (eaten) {
                return;
            }

            let currentOffset = 0;

            burgerLayers.forEach(function (item, index) {
                const layer = document.createElement(
                    item.type === "sauce" ? "div" : "img"
                );

                layer.style.zIndex = index + 1;

                if (item.type === "sauce") {
                    layer.style.position = "absolute";
                    layer.style.left = "50%";
                    layer.style.width = "85%";
                    layer.style.height = "30px";
                    layer.style.fontSize = "42px";
                    layer.style.lineHeight = "30px";
                    layer.style.textAlign = "center";
                    layer.style.whiteSpace = "nowrap";
                    layer.style.color = item.color;
                    layer.textContent = "〰";
                    layer.style.transform =
                        "translate(-50%, " + currentOffset + "px)";
                    layer.style.top = "70%";

                    currentOffset -= 12;
                } else {
                    layer.className = "burger-layer";
                    layer.src = item.file;
                    layer.alt = item.name;
                    layer.draggable = false;

                    /*
                        Каждая картинка накладывается на предыдущую.
                        Высота изображения определяется автоматически.
                    */

                    layer.style.top = "50%";
                    layer.style.transform =
                        "translate(-50%, calc(-50% + " +
                        currentOffset + "px))";

                    layer.onload = function () {
                        updateLayerPositions();
                    };

                    layer.onerror = function () {
                        layer.style.display = "none";
                        console.warn("Не удалось загрузить изображение:", item.file);
                    };

                    burger.appendChild(layer);

                    return;
                }

                burger.appendChild(layer);
            });

            updateLayerPositions();
        }

        /*
            Вычисляем позиции картинок по их реальным размерам.
            Благодаря этому слои не зависят от прозрачных полей
            после того, как изображения будут обрезаны.
        */

        function updateLayerPositions() {
            const layers = Array.from(
                burger.querySelectorAll(".burger-layer")
            );

            let offset = 0;

            layers.forEach(function (layer, index) {
                const item = burgerLayers[index];

                if (!item || !layer.naturalWidth || !layer.naturalHeight) {
                    return;
                }

                const renderedWidth = layer.clientWidth;
                const scale = renderedWidth / layer.naturalWidth;
                const renderedHeight = layer.naturalHeight * scale;

                if (index > 0) {
                    const settings = layerSettings[item.type] ||
                        layerSettings.bun;

                    const overlap = settings.overlap;

                    offset -= renderedHeight * (1 - overlap);
                }

                layer.style.top = "50%";
                layer.style.transform =
                    "translate(-50%, calc(-50% + " + offset + "px))";
            });
        }

        // Список картинок с кнопками перемещения и удаления.

        function renderIngredientList() {
            ingredientList.innerHTML = "";

            burgerLayers.forEach(function (item, index) {
                const row = document.createElement("div");
                row.className = "ingredient-item";

                if (item.type === "sauce") {
                    const sauceIcon = document.createElement("div");
                    sauceIcon.style.width = "55px";
                    sauceIcon.style.height = "55px";
                    sauceIcon.style.flex = "1";
                    sauceIcon.style.display = "flex";
                    sauceIcon.style.alignItems = "center";
                    sauceIcon.style.justifyContent = "center";
                    sauceIcon.style.color = item.color;
                    sauceIcon.style.fontSize = "28px";
                    sauceIcon.textContent = "〰";

                    row.appendChild(sauceIcon);
                } else {
                    const image = document.createElement("img");
                    image.src = item.file;
                    image.alt = item.name;

                    row.appendChild(image);
                }

                const controls = document.createElement("div");
                controls.className = "ingredient-controls";

                const upButton = document.createElement("button");
                upButton.type = "button";
                upButton.textContent = "↑";
                upButton.title = "Поднять слой";
                upButton.disabled = saved ||
                    index === burgerLayers.length - 1;

                upButton.addEventListener("click", function () {
                    if (saved || index >= burgerLayers.length - 1) {
                        return;
                    }

                    const temp = burgerLayers[index];
                    burgerLayers[index] = burgerLayers[index + 1];
                    burgerLayers[index + 1] = temp;

                    renderBurger();
                    renderIngredientList();
                });

                const downButton = document.createElement("button");
                downButton.type = "button";
                downButton.textContent = "↓";
                downButton.title = "Опустить слой";
                downButton.disabled = saved || index === 0;

                downButton.addEventListener("click", function () {
                    if (saved || index <= 0) {
                        return;
                    }

                    const temp = burgerLayers[index];
                    burgerLayers[index] = burgerLayers[index - 1];
                    burgerLayers[index - 1] = temp;

                    renderBurger();
                    renderIngredientList();
                });

                controls.appendChild(upButton);
                controls.appendChild(downButton);
                row.appendChild(controls);

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-button";
                deleteButton.type = "button";
                deleteButton.textContent = "×";
                deleteButton.title = "Удалить";
                deleteButton.disabled = saved;

                deleteButton.addEventListener("click", function () {
                    if (saved) {
                        return;
                    }

                    burgerLayers.splice(index, 1);

                    renderBurger();
                    renderIngredientList();
                });

                row.appendChild(deleteButton);
                ingredientList.appendChild(row);
            });
        }

        // Сохранение сборки.

        saveButton.addEventListener("click", function () {
            if (saved || eaten) {
                return;
            }

            saved = true;

            status.textContent = "Бургер сохранён! Теперь его можно съесть.";
            saveButton.hidden = true;
            eatButton.hidden = false;

            renderCatalog();
            renderIngredientList();

            document.querySelectorAll(".sauce-button").forEach(function (button) {
                button.disabled = true;
            });
        });

        // Поедание бургера.

        eatButton.addEventListener("click", function () {
            if (!saved || eaten) {
                return;
            }

            eaten = true;

            burger.classList.add("eating");
            eatButton.disabled = true;

            setTimeout(function () {
                burger.innerHTML = "";
                status.textContent = "Ням! Бургер съеден! 🍔";

                resetButton.textContent = "Собрать новый";
            }, 800);
        });

        // Сброс и новая сборка.

        resetButton.addEventListener("click", function () {
            burgerLayers = createInitialBurger();
            saved = false;
            eaten = false;

            burger.classList.remove("eating");
            burger.style.opacity = "1";
            burger.style.transform = "";

            status.textContent = "";
            saveButton.hidden = false;
            eatButton.hidden = true;
            eatButton.disabled = false;
            resetButton.textContent = "Заново";

            document.querySelectorAll(".sauce-button").forEach(function (button) {
                button.disabled = false;
            });

            renderBurger();
            renderIngredientList();
            renderCatalog();
        });

        // Кнопки соусов.

        document.querySelectorAll(".sauce-button").forEach(function (button) {
            button.addEventListener("click", function () {
                addSauce(button.dataset.sauce);
            });
        });

        // Первый запуск.

        renderCatalog();
        renderBurger();
        renderIngredientList();
    </script>

</body>
</html>
