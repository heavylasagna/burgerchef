<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Maker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <!-- Основной интерфейс игры -->
  <div class="app-container">
    <header class="top-header">
      <div id="walletWidget" class="wallet-widget">
        <span id="walletBadge" class="positive">$100.00</span>
      </div>
      <div id="topOrderWidget" class="top-order-widget">
        <span id="orderStatusText">🔔 Order: Classic Burger</span>
      </div>
    </header>

    <div class="main-workspace">
      <!-- Левая панель: Слои бургера / Инвентарь -->
      <div class="panel left-panel" id="leftPanel">
        <h3 class="panel-title">Layers (0/30)</h3>
        <div class="layers-list" id="layersList"></div>
      </div>

      <!-- Центральная зона: Сборка бургера / Гриль / Доска -->
      <div class="center-stage" id="centerStage">
        <div class="burger-stack" id="burgerStack"></div>
        <div class="limit-warning" id="limitWarning">Layer limit reached (30/30)!</div>
      </div>

      <div class="center-stage" id="grillStage" style="display: none;">
        <div class="cooking-area" id="grillCookingArea"></div>
      </div>

      <div class="center-stage" id="boardStage" style="display: none;">
        <div class="cooking-area" id="boardCookingArea"></div>
      </div>

      <!-- Правая панель: Ингредиенты / Меню -->
      <div class="panel right-panel" id="rightPanel">
        <h3 class="panel-title">Ingredients</h3>
        <div class="ingredients-menu" id="ingredientsMenu"></div>
      </div>
    </div>

    <!-- Нижняя панель управления -->
    <div class="panel bottom-panel" id="bottomPanel">
      <div class="sauces-group" id="desktopSaucesGroup"></div>
      
      <div class="actions-group">
        <button id="openRecipesWidgetBtn" class="btn-action" title="Recipes">📋</button>
        <button id="openShopBtn" class="btn-action" title="Shop">🏬</button>
        <button id="openInventoryBtn" class="btn-action" title="Inventory">🎒</button>
        <button id="openAchievementsBtn" class="btn-action" title="Achievements">🏆</button>
        <button id="forceOrderBtn" class="btn-action" title="Summon Order">🔔</button>
        <button id="skipOrderBtn" class="btn-action" title="Skip Order">⏩</button>
        <button id="eatBtn" class="btn-action" title="Eat Burger">🍔</button>
        <button id="submitOrderBtn" class="btn-action" title="Serve Order">🍽</button>
        <button id="squeezeBtn" class="btn-action" title="Squeeze">✊</button>
        <button id="resetBtn" class="btn-action" title="Bin">🗑</button>
        <button id="knifeBtn" class="btn-action" title="Cut All" style="display: none;">🔪</button>
        <button id="downloadPngBtn" class="btn-action" title="Save PNG">💾</button>
        <button id="openSettingsBtn" class="btn-action" title="Settings">⚙</button>
      </div>

      <div class="screen-switchers">
        <button id="switchToAssemblyBtn" class="screen-switch-btn active" title="Assembly">🍔</button>
        <button id="switchToGrillBtn" class="screen-switch-btn" title="Grill">🔥</button>
        <button id="switchToBoardBtn" class="screen-switch-btn" title="Cutting Board">🔪</button>
      </div>
    </div>

    <!-- Мобильные соусы -->
    <div class="mobile-sauces-group" id="mobileSaucesGroup"></div>
  </div>

  <!-- Виджет закрепленного рецепта -->
  <div id="pinnedRecipeWidget" class="pinned-recipe-widget">
    <div class="pinned-header">
      <span>📌 Pinned Recipe</span>
      <button id="unpinBtn">✕</button>
    </div>
    <div id="pinnedIngredientsContainer" class="pinned-ingredients"></div>
  </div>

  <!-- Окно приветствия -->
  <div id="welcomeModal" class="modal-overlay">
    <div class="modal-content">
      <h3>Welcome to Burger Maker!</h3>
      <p>Would you like to take a quick interactive tutorial?</p>
      <div class="modal-buttons">
        <button id="welcomeNoBtn" class="btn-secondary">Skip</button>
        <button id="welcomeYesBtn" class="btn-primary">Start Tutorial</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно Рецептов -->
  <div id="recipesModal" class="modal-overlay">
    <div class="modal-content large">
      <div class="modal-header">
        <h3>Recipes</h3>
        <button id="closeRecipesModal" class="modal-close-btn">✕</button>
      </div>
      <div id="recipesModalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Модальное окно Магазина -->
  <div id="shopModal" class="modal-overlay">
    <div class="modal-content large">
      <div class="modal-header">
        <h3>Groceries Shop</h3>
        <button id="closeShopModal" class="modal-close-btn">✕</button>
      </div>
      <div class="recipe-tabs" id="shopTabs">
        <button class="recipe-tab active" onclick="switchShopTab('all')">All</button>
        <button class="recipe-tab" onclick="switchShopTab('bread')">Bread</button>
        <button class="recipe-tab" onclick="switchShopTab('patty')">Patty</button>
        <button class="recipe-tab" onclick="switchShopTab('protein')">Protein</button>
        <button class="recipe-tab" onclick="switchShopTab('vegetables')">Veg</button>
        <button class="recipe-tab" onclick="switchShopTab('sauce')">Sauce</button>
      </div>
      <div id="shopModalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Модальное окно Инвентаря -->
  <div id="inventoryModal" class="modal-overlay">
    <div class="modal-content large">
      <div class="modal-header">
        <h3>Your Inventory</h3>
        <button id="closeInventoryModal" class="modal-close-btn">✕</button>
      </div>
      <div class="recipe-tabs" id="inventoryTabs">
        <button class="recipe-tab active" onclick="switchInventoryTab('all')">All</button>
        <button class="recipe-tab" onclick="switchInventoryTab('bread')">Bread</button>
        <button class="recipe-tab" onclick="switchInventoryTab('patty')">Patty</button>
        <button class="recipe-tab" onclick="switchInventoryTab('protein')">Protein</button>
        <button class="recipe-tab" onclick="switchInventoryTab('vegetables')">Veg</button>
        <button class="recipe-tab" onclick="switchInventoryTab('sauce')">Sauce</button>
      </div>
      <div id="inventoryModalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Модальное окно Достижений -->
  <div id="achievementsModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Achievements & Secrets</h3>
        <button id="closeAchievementsModal" class="modal-close-btn">✕</button>
      </div>
      <div id="achievementsList" class="modal-body" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>

  <!-- Модальное окно Настроек -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Settings</h3>
        <button id="closeSettingsModal" class="modal-close-btn">✕</button>
      </div>
      <div class="modal-body" style="display:flex; flex-direction:column; gap:16px;">
        <div class="setting-item">
          <label>Volume: <span id="volumeVal">100%</span></label>
          <input type="range" id="volumeRange" min="0" max="100" value="100">
        </div>
        <div class="setting-item">
          <label>Theme</label>
          <div style="display:flex; gap:8px;">
            <button id="themeDarkBtn" class="btn-secondary active" onclick="setTheme('dark')">Dark</button>
            <button id="themeLightBtn" class="btn-secondary" onclick="setTheme('light')">Light</button>
          </div>
        </div>
        <div class="setting-item">
          <label>Game Mode</label>
          <div style="display:flex; gap:8px;">
            <button id="modeSandboxBtn" class="btn-secondary">Sandbox</button>
            <button id="modeCasualBtn" class="btn-secondary active">Casual</button>
            <button id="modeTurboBtn" class="btn-secondary">Turbo</button>
          </div>
        </div>
        <div class="setting-item" id="speedButtonsContainer">
          <label>Order Frequency</label>
          <div class="speed-buttons-grid" id="speedButtonsGrid">
            <button class="speed-btn" data-speed="no-orders">No Orders</button>
            <button class="speed-btn" data-speed="super-slow">Super Slow</button>
            <button class="speed-btn" data-speed="slow">Slow</button>
            <button class="speed-btn active" data-speed="medium">Medium</button>
            <button class="speed-btn" data-speed="fast">Fast</button>
            <button class="speed-btn" data-speed="super-fast">Super Fast</button>
            <button class="speed-btn" data-speed="turbo">Turbo</button>
          </div>
        </div>
        <div class="setting-item" id="tutorialFinalSection">
          <label>Tutorial & Data</label>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button id="openTutorialFromSettingsBtn" class="btn-secondary">Restart Tutorial</button>
            <button id="resetAchievementsBtn" class="btn-secondary">Reset Achievements</button>
            <button id="hardResetBtn" class="btn-secondary" style="border-color: #d32f2f; color: #d32f2f;">Reset All Data</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Оверлей туториала -->
  <div id="tutorialOverlay" class="tutorial-overlay">
    <div id="tutorialSpotlight"></div>
    <div id="tutorialTooltip" class="tutorial-tooltip">
      <div class="tutorial-header">
        <h3 id="tutorialTitle">Title</h3>
        <span id="tutorialStepIndicator">1 / 15</span>
      </div>
      <p id="tutorialText" class="tutorial-text">Text here...</p>
      <div class="tutorial-buttons">
        <button id="tutorialPrevBtn" class="btn-secondary">Prev</button>
        <button id="tutorialNextBtn" class="btn-primary">Next</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
