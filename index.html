<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор Бургеров</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      color: #333;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .app-container {
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      grid-template-rows: 1fr 110px;
      height: 100vh;
      width: 100vw;
      gap: 20px;
      padding: 20px;
    }

    .panel {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #eef1f5;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 15px;
      text-align: center;
      color: #2c3e50;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Левая панель */
    .left-panel {
      grid-column: 1;
      grid-row: 1;
      overflow: hidden;
    }

    .layers-list {
      display: flex;
      flex-direction: column-reverse;
      gap: 10px;
      overflow-y: auto;
      flex: 1;
      padding-right: 5px;
    }

    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      transition: background 0.2s;
    }

    .layer-item:hover {
      background: #f1f5f9;
    }

    .layer-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .layer-preview {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .layer-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
    }

    .layer-controls {
      display: flex;
      gap: 4px;
    }

    .btn-control {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #64748b;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-control:hover:not(:disabled) {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }

    .btn-control.delete:hover {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
    }

    .btn-control:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Центр */
    .center-stage {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
      padding-bottom: 50px;
      overflow-y: auto; 
      overflow-x: hidden;
    }

    .burger-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-height: 100%;
      width: 100%;
      position: relative;
    }

    .burger-stack {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      position: relative;
    }

    /* Слегка уменьшенное перекрытие слоев (на 15-20% свободнее) */
    .burger-layer-img {
      display: block;
      width: auto;
      height: auto;
      max-width: 200px;
      position: relative;
    }

    .burger-layer-img.new-layer {
      animation: smoothDropIn 0.4s ease-out forwards;
    }

    .layer-bottom-bun { margin-bottom: -40px; }
    .layer-beef-patty { margin-bottom: -48px; }
    .layer-top-bun { margin-bottom: -52px; }
    .layer-default { margin-bottom: -44px; }

    @keyframes smoothDropIn {
      0% {
        opacity: 0;
        transform: translateY(-25px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Режим поедания цельной картинки */
    .eaten-burger-wrapper {
      position: relative;
      display: inline-block;
      cursor: crosshair;
    }

    .eaten-burger-img {
      max-width: 220px;
      display: block;
    }

    /* Укус (вырезает кусочек цветом фона) */
    .bite-mark {
      position: absolute;
      background: #f4f6f8;
      border-radius: 50%;
      pointer-events: none;
      transform: scale(0);
      animation: bitePop 0.1s ease-out forwards;
      z-index: 10;
    }

    @keyframes bitePop {
      to { transform: scale(1); }
    }

    /* Крошки */
    .crumb {
      position: absolute;
      border-radius: 3px;
      pointer-events: none;
      z-index: 100;
      animation: crumbFly 0.4s ease-out forwards;
    }

    @keyframes crumbFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(var(--rot));
      }
    }

    .limit-warning {
      position: absolute;
      top: 15px;
      background: #ef4444;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 200;
    }
    .limit-warning.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Правая панель */
    .right-panel {
      grid-column: 3;
      grid-row: 1;
      overflow: hidden;
    }

    .ingredients-menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      flex: 1;
      padding-right: 5px;
    }

    .ingredient-card {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ingredient-card:hover {
      background: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.12);
      transform: translateY(-2px);
    }

    .ingredient-card.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .ingredient-card img {
      width: 45px;
      height: 45px;
      object-fit: contain;
    }

    .ingredient-card span {
      font-size: 0.95rem;
      font-weight: 600;
      color: #334155;
    }

    /* Нижняя панель */
    .bottom-panel {
      grid-column: 1 / -1;
      grid-row: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      z-index: 100;
      background: #ffffff;
    }

    .sauces-group {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
    }

    .sauce-chip {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .sauce-chip:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .action-group {
      display: flex;
      gap: 12px;
    }

    .btn-action {
      padding: 12px 26px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-eat {
      background: #10b981;
      color: #ffffff;
    }

    .btn-eat:hover {
      background: #059669;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .btn-eat.active-eating {
      background: #f59e0b;
      animation: pulseEat 1.5s infinite;
    }

    @keyframes pulseEat {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }

    .btn-reset {
      background: #f43f5e;
      color: #ffffff;
    }

    .btn-reset:hover {
      background: #e11d48;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="panel left-panel">
      <div class="panel-title" id="layersTitle">Слои (0/20)</div>
      <div class="layers-list" id="layersList"></div>
    </div>

    <div class="center-stage" id="centerStage">
      <div class="limit-warning" id="limitWarning">Максимум 20 ингредиентов!</div>
      <div class="burger-wrapper" id="burgerWrapper">
        <div class="burger-stack" id="burgerStack"></div>
      </div>
    </div>

    <div class="panel right-panel">
      <div class="panel-title">Ингредиенты</div>
      <div class="ingredients-menu" id="ingredientsMenu"></div>
    </div>

    <div class="panel bottom-panel">
      <div class="sauces-group" id="saucesGroup">
        <span style="font-size: 0.9rem; font-weight:600; color: #94a3b8; margin-right: 5px;">Соусы:</span>
      </div>
      <div class="action-group">
        <button class="btn-action btn-eat" id="eatBtn">Съесть 😋</button>
        <button class="btn-action btn-reset" id="resetBtn">Сброс 🗑️</button>
      </div>
    </div>
  </div>

  <script>
    const MAX_INGREDIENTS = 20;

    const INGREDIENTS = [
      { id: 'top-bun', name: 'Верхняя булочка', image: 'images/top-bun.png' },
      { id: 'beef-patty', name: 'Говяжья котлета', image: 'images/beef-patty.png' },
      { id: 'bottom-bun', name: 'Нижняя булочка', image: 'images/bottom-bun.png' }
    ];

    const SAUCES = [
      { id: 'ketchup', name: 'Кетчуп 🥫' },
      { id: 'mayo', name: 'Майонез 🤍' },
      { id: 'mustard', name: 'Горчица 🟡' },
      { id: 'bbq', name: 'Барбекю 🍖' }
    ];

    let currentBurger = [
      { ...INGREDIENTS.find(item => item.id === 'bottom-bun') },
      { ...INGREDIENTS.find(item => item.id === 'beef-patty') },
      { ...INGREDIENTS.find(item => item.id === 'top-bun') }
    ];

    let isEatingMode = false;
    let totalBitesNeeded = 0;
    let currentBites = 0;

    const burgerWrapper = document.getElementById('burgerWrapper');
    const burgerStack = document.getElementById('burgerStack');
    const layersList = document.getElementById('layersList');
    const layersTitle = document.getElementById('layersTitle');
    const ingredientsMenu = document.getElementById('ingredientsMenu');
    const saucesGroup = document.getElementById('saucesGroup');
    const centerStage = document.getElementById('centerStage');
    const limitWarning = document.getElementById('limitWarning');
    const eatBtn = document.getElementById('eatBtn');

    function renderIngredientsMenu() {
      ingredientsMenu.innerHTML = '';
      INGREDIENTS.forEach(item => {
        const card = document.createElement('div');
        card.className = 'ingredient-card';
        if (currentBurger.length >= MAX_INGREDIENTS) {
          card.classList.add('disabled');
        }
        card.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <span>${item.name}</span>
        `;
        card.onclick = () => {
          if (isEatingMode) exitEatingMode();
          addIngredient(item);
        };
        ingredientsMenu.appendChild(card);
      });
    }

    function renderSauces() {
      SAUCES.forEach(sauce => {
        const chip = document.createElement('div');
        chip.className = 'sauce-chip';
        chip.innerText = sauce.name;
        chip.onclick = () => {
          if (isEatingMode) exitEatingMode();
          addSauce(sauce);
        };
        saucesGroup.appendChild(chip);
      });
    }

    function updateBurgerDisplay(isNewAdded = false) {
      if (isEatingMode) exitEatingMode();

      layersTitle.innerText = `Слои (${currentBurger.length}/${MAX_INGREDIENTS})`;

      layersList.innerHTML = '';
      currentBurger.forEach((item, index) => {
        const listItem = document.createElement('div');
        listItem.className = 'layer-item';
        listItem.innerHTML = `
          <div class="layer-info">
            ${item.image ? `<img src="${item.image}" class="layer-preview">` : ''}
            <span class="layer-name">${item.name}</span>
          </div>
          <div class="layer-controls">
            <button class="btn-control" onclick="moveLayer(${index}, 1)" ${index === currentBurger.length - 1 ? 'disabled' : ''}>▲</button>
            <button class="btn-control" onclick="moveLayer(${index}, -1)" ${index === 0 ? 'disabled' : ''}>▼</button>
            <button class="btn-control delete" onclick="removeLayer(${index})">✕</button>
          </div>
        `;
        layersList.appendChild(listItem);
      });

      const currentImgs = burgerStack.querySelectorAll('.burger-layer-img');
      
      if (!isNewAdded || currentImgs.length !== currentBurger.filter(i => i.image).length - 1) {
        burgerStack.innerHTML = '';
        currentBurger.forEach((item, index) => {
          if (item.image) {
            const img = document.createElement('img');
            img.src = item.image;
            img.className = `burger-layer-img ${getSpacingClass(item.id)}`;
            img.style.zIndex = index + 1;
            burgerStack.appendChild(img);
          }
        });
      } else {
        const newItem = currentBurger[currentBurger.length - 1];
        if (newItem.image) {
          const img = document.createElement('img');
          img.src = newItem.image;
          img.className = `burger-layer-img ${getSpacingClass(newItem.id)} new-layer`;
          img.style.zIndex = currentBurger.length;
          burgerStack.appendChild(img);
          
          setTimeout(() => img.classList.remove('new-layer'), 400);
        }
      }

      renderIngredientsMenu();

      setTimeout(() => {
        centerStage.scrollTop = centerStage.scrollHeight;
      }, 50);
    }

    function getSpacingClass(id) {
      if (id === 'bottom-bun') return 'layer-bottom-bun';
      if (id === 'beef-patty') return 'layer-beef-patty';
      if (id === 'top-bun') return 'layer-top-bun';
      return 'layer-default';
    }

    function showLimitWarning() {
      limitWarning.classList.add('show');
      setTimeout(() => limitWarning.classList.remove('show'), 2000);
    }

    function addIngredient(item) {
      if (currentBurger.length >= MAX_INGREDIENTS) {
        showLimitWarning();
        return;
      }
      currentBurger.push({ ...item });
      updateBurgerDisplay(true);
    }

    function addSauce(sauce) {
      if (currentBurger.length >= MAX_INGREDIENTS) {
        showLimitWarning();
        return;
      }
      currentBurger.push({ id: sauce.id, name: `Соус: ${sauce.name}` });
      updateBurgerDisplay(true);
    }

    function removeLayer(index) {
      currentBurger.splice(index, 1);
      updateBurgerDisplay(false);
    }

    function moveLayer(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex >= 0 && targetIndex < currentBurger.length) {
        const temp = currentBurger[index];
        currentBurger[index] = currentBurger[targetIndex];
        currentBurger[targetIndex] = temp;
        updateBurgerDisplay(false);
      }
    }

    function exitEatingMode() {
      isEatingMode = false;
      eatBtn.innerText = 'Съесть 😋';
      eatBtn.classList.remove('active-eating');
      updateBurgerDisplay(false);
    }

    document.getElementById('resetBtn').onclick = () => {
      exitEatingMode();
      currentBurger = [];
      updateBurgerDisplay(false);
    };

    // ПОЕДАНИЕ С ВЫРЕЗАНИЕМ КУСОЧКОВ БЕЗ ИСКАЖЕНИЯ ПРОПОРЦИЙ
    eatBtn.onclick = async () => {
      if (currentBurger.length === 0 || isEatingMode) return;

      isEatingMode = true;
      eatBtn.innerText = 'Кликай по бургеру! 🍽️';
      eatBtn.classList.add('active-eating');

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 300;
      canvas.height = Math.max(300, currentBurger.length * 30 + 100);

      const imagesToLoad = currentBurger.filter(i => i.image);

      const loadedImgs = await Promise.all(imagesToLoad.map(item => {
        return new Promise(resolve => {
          const img = new Image();
          img.src = item.image;
          img.onload = () => resolve({ img, id: item.id });
        });
      }));

      let currentY = canvas.height - 110;
      loadedImgs.forEach(({ img, id }) => {
        let offset = 40;
        if (id === 'top-bun') offset = 48;
        if (id === 'beef-patty') offset = 35;

        ctx.drawImage(img, (canvas.width - 200) / 2, currentY, 200, (img.height / img.width) * 200);
        currentY -= offset;
      });

      const singleImgUrl = canvas.toDataURL();
      
      burgerWrapper.innerHTML = `
        <div class="eaten-burger-wrapper" id="eatenWrapper">
          <img src="${singleImgUrl}" class="eaten-burger-img" id="eatenImg">
        </div>
      `;

      // Расчет количества укусов до 70% площади (примерно 15-25 кликов в зависимости от высоты)
      totalBitesNeeded = Math.max(8, currentBurger.length * 3);
      currentBites = 0;

      const eatenWrapper = document.getElementById('eatenWrapper');

      eatenWrapper.onclick = (e) => {
        if (!isEatingMode) return;

        const rect = eatenWrapper.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Создаем вырез (укус) цветом фона
        const bite = document.createElement('div');
        bite.className = 'bite-mark';
        const size = Math.floor(Math.random() * 30) + 40;
        bite.style.width = `${size}px`;
        bite.style.height = `${size}px`;
        bite.style.left = `${x - size / 2}px`;
        bite.style.top = `${y - size / 2}px`;
        eatenWrapper.appendChild(bite);

        createCrumbs(e.clientX, e.clientY);

        currentBites++;

        // Если съели примерно 70% (достигли лимита укусов) — полностью убираем бургер
        if (currentBites >= totalBitesNeeded) {
          setTimeout(() => {
            currentBurger = [];
            exitEatingMode();
          }, 150);
        }
      };
    };

    function createCrumbs(originX, originY) {
      const colors = ['#e0a96d', '#5d4037', '#ffd54f', '#81c784', '#e57373'];
      const crumbsCount = Math.floor(Math.random() * 6) + 6;

      for (let i = 0; i < crumbsCount; i++) {
        const crumb = document.createElement('div');
        crumb.className = 'crumb';
        
        const size = Math.floor(Math.random() * 6) + 4;
        crumb.style.width = `${size}px`;
        crumb.style.height = `${size}px`;
        crumb.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        crumb.style.left = `${originX}px`;
        crumb.style.top = `${originY}px`;

        const dx = (Math.random() - 0.5) * 120 + 'px';
        const dy = (Math.random() - 0.5) * 120 + 'px';
        const rot = (Math.random() - 0.5) * 360 + 'deg';

        crumb.style.setProperty('--dx', dx);
        crumb.style.setProperty('--dy', dy);
        crumb.style.setProperty('--rot', rot);

        document.body.appendChild(crumb);
        setTimeout(() => crumb.remove(), 400);
      }
    }

    renderIngredientsMenu();
    renderSauces();
    updateBurgerDisplay(false);
  </script>
</body>
</html>
