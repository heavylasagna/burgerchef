<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор Бургеров</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      color: #333;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Сетка всего интерфейса */
    .app-container {
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      grid-template-rows: 1fr 110px;
      height: 100vh;
      width: 100vw;
      gap: 20px;
      padding: 20px;
    }

    .panel {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #eef1f5;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 15px;
      text-align: center;
      color: #2c3e50;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* 1. ЛЕВАЯ ПАНЕЛЬ: Добавленные слои */
    .left-panel {
      grid-column: 1;
      grid-row: 1;
      overflow: hidden;
    }

    .layers-list {
      display: flex;
      flex-direction: column-reverse;
      gap: 10px;
      overflow-y: auto;
      flex: 1;
      padding-right: 5px;
    }

    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      transition: background 0.2s;
    }

    .layer-item:hover {
      background: #f1f5f9;
    }

    .layer-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .layer-preview {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .layer-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
    }

    .layer-controls {
      display: flex;
      gap: 4px;
    }

    .btn-control {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #64748b;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-control:hover:not(:disabled) {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }

    .btn-control.delete:hover {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
    }

    .btn-control:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* 2. ЦЕНТР: Визуальная сборка бургера */
    .center-stage {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
      padding-bottom: 20px;
      overflow-y: auto; 
      overflow-x: hidden;
    }

    .burger-stack {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      position: relative;
      transition: transform 0.2s ease;
    }

    /* Режим интерактивного поедания курсором */
    .burger-stack.interactive-eating {
      cursor: crosshair;
    }
    .burger-stack.interactive-eating .burger-layer-img:hover {
      filter: brightness(0.9) sepia(0.2);
    }

    /* Базовый стиль слоя (уменьшен в ~2 раза) */
    .burger-layer-img {
      display: block;
      width: auto;
      height: auto;
      max-width: 200px;
      position: relative;
      animation: dropIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Индивидуальные настройки отступов под конкретные ингредиенты для идеального прилегания */
    .layer-bottom-bun {
      margin-bottom: -50px;
      z-index: 1;
    }
    .layer-beef-patty {
      margin-bottom: -60px;
      z-index: 2;
    }
    .layer-top-bun {
      margin-bottom: 0px;
      z-index: 5;
    }
    /* Для любых других добавляемых слоев по умолчанию */
    .layer-default {
      margin-bottom: -55px;
      z-index: 3;
    }

    @keyframes dropIn {
      0% {
        opacity: 0;
        transform: translateY(-40px) rotate(-3deg) scale(0.9);
      }
      70% {
        transform: translateY(5px) rotate(2deg) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) rotate(0deg) scale(1);
      }
    }

    .plate {
      width: 240px;
      height: 14px;
      background: #e2e8f0;
      border-radius: 50%;
      margin-top: -2px;
      flex-shrink: 0;
    }

    /* Эффект откуса (создается динамически кликом) */
    .bite-mark {
      position: absolute;
      background: #f4f6f8; /* Цвет фона сцены */
      border-radius: 50%;
      pointer-events: none;
      transform: scale(0);
      animation: bitePop 0.3s forwards;
      z-index: 10;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
    }

    @keyframes bitePop {
      to {
        transform: scale(1);
      }
    }

    /* 3. ПРАВАЯ ПАНЕЛЬ: Меню ингредиентов */
    .right-panel {
      grid-column: 3;
      grid-row: 1;
      overflow: hidden;
    }

    .ingredients-menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      flex: 1;
      padding-right: 5px;
    }

    .ingredient-card {
      display: flex;
      align-items: center;
      gap: 15px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ingredient-card:hover {
      background: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.12);
      transform: translateY(-2px);
    }

    .ingredient-card img {
      width: 45px;
      height: 45px;
      object-fit: contain;
    }

    .ingredient-card span {
      font-size: 0.95rem;
      font-weight: 600;
      color: #334155;
    }

    /* 4. НИЖНЯЯ ПАНЕЛЬ: Соусы и Действия */
    .bottom-panel {
      grid-column: 1 / -1;
      grid-row: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      z-index: 100;
      background: #ffffff;
    }

    .sauces-group {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
    }

    .sauce-chip {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .sauce-chip:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .action-group {
      display: flex;
      gap: 12px;
    }

    .btn-action {
      padding: 12px 26px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-eat {
      background: #10b981;
      color: #ffffff;
    }

    .btn-eat:hover {
      background: #059669;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .btn-eat.active-eating {
      background: #f59e0b;
      animation: pulseEat 1.5s infinite;
    }

    @keyframes pulseEat {
      0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
    }

    .btn-reset {
      background: #f43f5e;
      color: #ffffff;
    }

    .btn-reset:hover {
      background: #e11d48;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
    }

    /* Кастомный скроллбар */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Левая панель: Список слоев -->
    <div class="panel left-panel">
      <div class="panel-title">Слои бургера</div>
      <div class="layers-list" id="layersList"></div>
    </div>

    <!-- Центр: Отрисовка бургера -->
    <div class="center-stage" id="centerStage">
      <div class="burger-stack" id="burgerStack"></div>
      <div class="plate"></div>
    </div>

    <!-- Правая панель: Выбор ингредиентов -->
    <div class="panel right-panel">
      <div class="panel-title">Ингредиенты</div>
      <div class="ingredients-menu" id="ingredientsMenu"></div>
    </div>

    <!-- Нижняя панель: Соусы и кнопки -->
    <div class="panel bottom-panel">
      <div class="sauces-group" id="saucesGroup">
        <span style="font-size: 0.9rem; font-weight:600; color: #94a3b8; margin-right: 5px;">Соусы:</span>
      </div>
      <div class="action-group">
        <button class="btn-action btn-eat" id="eatBtn">Съесть 😋</button>
        <button class="btn-action btn-reset" id="resetBtn">Сброс 🗑️</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Конфигурация ингредиентов
    const INGREDIENTS = [
      { id: 'top-bun', name: 'Верхняя булочка', image: 'images/top-bun.png' },
      { id: 'beef-patty', name: 'Говяжья котлета', image: 'images/beef-patty.png' },
      { id: 'bottom-bun', name: 'Нижняя булочка', image: 'images/bottom-bun.png' }
    ];

    // Конфигурация соусов
    const SAUCES = [
      { id: 'ketchup', name: 'Кетчуп 🥫' },
      { id: 'mayo', name: 'Майонез 🤍' },
      { id: 'mustard', name: 'Горчица 🟡' },
      { id: 'bbq', name: 'Барбекю 🍖' }
    ];

    // Начальный бургер
    let currentBurger = [
      { ...INGREDIENTS.find(item => item.id === 'bottom-bun') },
      { ...INGREDIENTS.find(item => item.id === 'beef-patty') },
      { ...INGREDIENTS.find(item => item.id === 'top-bun') }
    ];

    let isEatingMode = false;

    const burgerStack = document.getElementById('burgerStack');
    const layersList = document.getElementById('layersList');
    const ingredientsMenu = document.getElementById('ingredientsMenu');
    const saucesGroup = document.getElementById('saucesGroup');
    const centerStage = document.getElementById('centerStage');
    const eatBtn = document.getElementById('eatBtn');

    function renderIngredientsMenu() {
      ingredientsMenu.innerHTML = '';
      INGREDIENTS.forEach(item => {
        const card = document.createElement('div');
        card.className = 'ingredient-card';
        card.innerHTML = `
          <img src="${item.image}" alt="${item.name}">
          <span>${item.name}</span>
        `;
        card.onclick = () => {
          if (isEatingMode) exitEatingMode();
          addIngredient(item);
        };
        ingredientsMenu.appendChild(card);
      });
    }

    function renderSauces() {
      SAUCES.forEach(sauce => {
        const chip = document.createElement('div');
        chip.className = 'sauce-chip';
        chip.innerText = sauce.name;
        chip.onclick = () => {
          if (isEatingMode) exitEatingMode();
          addSauce(sauce);
        };
        saucesGroup.appendChild(chip);
      });
    }

    function updateBurgerDisplay() {
      burgerStack.innerHTML = '';
      layersList.innerHTML = '';

      currentBurger.forEach((item, index) => {
        if (item.image) {
          const img = document.createElement('img');
          img.src = item.image;
          
          // Определяем класс отступа в зависимости от ID слоя
          let spacingClass = 'layer-default';
          if (item.id === 'bottom-bun') spacingClass = 'layer-bottom-bun';
          else if (item.id === 'beef-patty') spacingClass = 'layer-beef-patty';
          else if (item.id === 'top-bun') spacingClass = 'layer-top-bun';

          img.className = `burger-layer-img ${spacingClass}`;
          img.alt = item.name;
          burgerStack.appendChild(img);
        }

        const listItem = document.createElement('div');
        listItem.className = 'layer-item';
        listItem.innerHTML = `
          <div class="layer-info">
            ${item.image ? `<img src="${item.image}" class="layer-preview">` : ''}
            <span class="layer-name">${item.name}</span>
          </div>
          <div class="layer-controls">
            <button class="btn-control" onclick="moveLayer(${index}, 1)" ${index === currentBurger.length - 1 ? 'disabled' : ''}>▲</button>
            <button class="btn-control" onclick="moveLayer(${index}, -1)" ${index === 0 ? 'disabled' : ''}>▼</button>
            <button class="btn-control delete" onclick="removeLayer(${index})">✕</button>
          </div>
        `;
        layersList.appendChild(listItem);
      });

      // Плавная прокрутка к новому элементу снизу вверх
      setTimeout(() => {
        centerStage.scrollTop = centerStage.scrollHeight;
      }, 50);
    }

    function addIngredient(item) {
      currentBurger.push({ ...item });
      updateBurgerDisplay();
    }

    function addSauce(sauce) {
      currentBurger.push({ id: sauce.id, name: `Соус: ${sauce.name}` });
      updateBurgerDisplay();
    }

    function removeLayer(index) {
      currentBurger.splice(index, 1);
      updateBurgerDisplay();
    }

    function moveLayer(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex >= 0 && targetIndex < currentBurger.length) {
        const temp = currentBurger[index];
        currentBurger[index] = currentBurger[targetIndex];
        currentBurger[targetIndex] = temp;
        updateBurgerDisplay();
      }
    }

    function exitEatingMode() {
      isEatingMode = false;
      burgerStack.classList.remove('interactive-eating');
      eatBtn.innerText = 'Съесть 😋';
      eatBtn.classList.remove('active-eating');
    }

    // Кнопка Сброс
    document.getElementById('resetBtn').onclick = () => {
      exitEatingMode();
      currentBurger = [];
      updateBurgerDisplay();
    };

    // Кнопка Съесть (активация интерактивного поедания кусками)
    eatBtn.onclick = (e) => {
      if (currentBurger.length === 0) return;

      if (!isEatingMode) {
        isEatingMode = true;
        burgerStack.classList.add('interactive-eating');
        eatBtn.innerText = 'Кликай по бургеру! 🍽️';
        eatBtn.classList.add('active-eating');
      }
    };

    // Клик по стопке бургера для откусывания кусочков
    burgerStack.onclick = (e) => {
      if (!isEatingMode) return;

      const rect = burgerStack.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // Создаем элемент анимации откуса
      const bite = document.createElement('div');
      bite.className = 'bite-mark';
      const size = Math.floor(Math.random() * 40) + 45; // Случайный размер укуса
      bite.style.width = `${size}px`;
      bite.style.height = `${size}px`;
      bite.style.left = `${x - size / 2}px`;
      bite.style.top = `${y - size / 2}px`;
      
      burgerStack.appendChild(bite);

      // Если кликов много и съедено много частей — постепенно удаляем слои снизу или сверху
      if (burgerStack.querySelectorAll('.bite-mark').length >= currentBurger.length * 3) {
        currentBurger.shift(); // Убираем нижний слой
        updateBurgerDisplay();
        if (currentBurger.length === 0) {
          exitEatingMode();
        }
      }
    };

    // Инициализация при загрузке
    renderIngredientsMenu();
    renderSauces();
    updateBurgerDisplay();
  </script>
</body>
</html>
