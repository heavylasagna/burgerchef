<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Burger Maker</title>
  
  <link rel="icon" type="image/png" href="images/icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <!-- Кошелёк -->
  <div class="wallet-widget" id="walletWidget">
    <span id="walletBadge">$100.00</span>
  </div>

  <!-- Модальное окно Настроек -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Settings</h3>
        <button class="close-modal" id="closeSettingsModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-group">
          <label>Volume: <span id="volumeVal">100%</span></label>
          <input type="range" id="volumeRange" min="0" max="100" value="100">
        </div>
        <div class="settings-group">
          <label>Theme</label>
          <div class="settings-row">
            <button id="themeDarkBtn" class="active" onclick="setTheme('dark')">Dark</button>
            <button id="themeLightBtn" onclick="setTheme('light')">Light</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Основной интерфейс -->
  <div class="app-container">
    <div class="center-stage" id="centerStage">
      <div class="burger-wrapper">
        <div class="burger-stack" id="burgerStack"></div>
      </div>
    </div>

    <div class="panel right-panel" id="rightPanel">
      <div class="panel-title">Ingredients</div>
      <div class="ingredients-menu" id="ingredientsMenu"></div>
    </div>

    <div class="panel left-panel" id="leftPanel">
      <div class="panel-title" id="layersTitle">Layers (0/30)</div>
      <div class="layers-list" id="layersList"></div>
    </div>

    <div class="bottom-panel" id="bottomPanel">
      <div class="sauces-group" id="desktopSaucesGroup"></div>
      <div class="action-group">
        <button class="btn-action btn-squeeze" id="squeezeBtn">Squeeze</button>
        <button class="btn-action btn-eat" id="eatBtn">Eat</button>
        <button class="btn-action btn-reset" id="resetBtn">🗑️</button>
        <button class="btn-action btn-utility" id="downloadPngBtn">💾</button>
        <button class="btn-action btn-settings" id="openSettingsBtn">⚙️</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
