<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Maker Game</title>
  <link rel="stylesheet" href="style.css">
  <!-- Подключаем html2canvas для скачивания бургера в PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <!-- Верхняя панель для мобильных устройств (уведомления и кошелек управляются динамически) -->
  <div class="mobile-top-bar">
    <button class="toggle-ui-btn" id="toggleUiBtn" title="Скрыть/Показать интерфейс">👁️</button>
  </div>

  <!-- Кошелек (баланс игрока) -->
  <div class="wallet-widget" id="walletWidget" title="Ваш баланс">
    💰 <span id="walletBadge">$100.00</span>
  </div>

  <!-- Контейнер для всплывающих уведомлений о деньгах (+/-) -->
  <div id="moneyPopupContainer" class="money-popup-container"></div>

  <!-- Закрепленный рецепт -->
  <div class="pinned-recipe-widget" id="pinnedRecipeWidget">
    <div class="pinned-header">
      <button class="unpin-btn" id="unpinBtn" title="Открепить рецепт">✕</button>
    </div>
    <div class="pinned-ingredients" id="pinnedIngredientsContainer"></div>
  </div>

  <!-- Виджет текущего заказа вверху по центру -->
  <div class="top-order-widget" id="topOrderWidget" title="Активный заказ">
    <div id="orderStatusText">Нет активных заказов</div>
  </div>

  <!-- Контейнер для всплывающих оповещений (Toast) -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Основной контейнер интерфейса игры -->
  <div class="app-container">

    <!-- Левая панель: Список слоев собранного бургера -->
    <div class="panel left-panel" id="leftPanel">
      <h3 class="panel-title" id="layersTitle">Layers (0/30)</h3>
      <div class="layers-list" id="layersList"></div>
    </div>

    <!-- Центральная сцена: Рабочая область сборки бургера -->
    <div class="center-stage" id="centerStage">
      <div class="limit-warning" id="limitWarning">Достигнут лимит ингредиентов! (30 макс.)</div>
      <div class="burger-wrapper">
        <div class="burger-stack" id="burgerStack"></div>
      </div>
    </div>

    <!-- Правая панель: Меню доступных ингредиентов -->
    <div class="panel right-panel" id="rightPanel">
      <h3 class="panel-title">Ingredients</h3>
      <div class="ingredients-menu" id="ingredientsMenu"></div>
    </div>

    <!-- Мобильные соусы (отображаются только на экранах телефонов) -->
    <div class="sauces-group mobile-sauces" id="mobileSaucesGroup"></div>

    <!-- Нижняя панель управления и соусов -->
    <div class="panel bottom-panel" id="bottomPanel">
      <!-- Соусы для десктопа -->
      <div class="sauces-group desktop-sauces" id="desktopSaucesGroup"></div>

      <!-- Кнопки действий -->
      <div class="actions-wrapper">
        <button class="btn-action" id="eatBtn" title="Съесть бургер">🍔 Eat</button>
        <button class="btn-action" id="submitOrderBtn" style="display:none;" title="Сдать заказ">✅ Submit</button>
        
        <div class="action-box">
          <button class="btn-action" id="squeezeBtn" title="Смять бургер">📐 Squeeze</button>
          <button class="btn-action" id="resetBtn" title="Очистить бургер">🗑️ Clear</button>
        </div>

        <div class="action-box">
          <button class="btn-action" id="forceOrderBtn" title="Вызвать новый заказ">🔔 Order</button>
          <button class="btn-action" id="skipOrderBtn" title="Пропустить заказ">⏭️ Skip</button>
        </div>

        <div class="action-box">
          <button class="btn-action" id="openShopBtn" title="Магазин">🛒 Shop</button>
          <button class="btn-action" id="openInventoryBtn" title="Инвентарь (Рюкзак)">🎒 Backpack</button>
          <button class="btn-action" id="openRecipesBtn" title="Книга рецептов">📖 Recipes</button>
          <button class="btn-action" id="openAchievementsBtn" title="Достижения">🏆 Achievements</button>
          <button class="btn-action" id="openSettingsBtn" title="Настройки">⚙️ Settings</button>
          <button class="btn-action" id="downloadPngBtn" title="Сохранить как PNG">💾 Save PNG</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Модальное окно Магазина -->
  <div class="modal-overlay" id="shopModal">
    <div class="modal-content wide">
      <div class="modal-header">
        <h3>🛒 Ingredient Shop</h3>
        <button class="close-modal" id="closeShopModal">✕</button>
      </div>
      <div class="recipe-tabs" id="shopTabs">
        <button class="recipe-tab active" onclick="switchShopTab('all')">All</button>
        <button class="recipe-tab" onclick="switchShopTab('bread')">Bread</button>
        <button class="recipe-tab" onclick="switchShopTab('patty')">Patty</button>
        <button class="recipe-tab" onclick="switchShopTab('protein')">Protein</button>
        <button class="recipe-tab" onclick="switchShopTab('vegetables')">Vegetables</button>
        <button class="recipe-tab" onclick="switchShopTab('sauce')">Sauce</button>
      </div>
      <div class="modal-body" id="shopModalBody"></div>
    </div>
  </div>

  <!-- Модальное окно Инвентаря (Рюкзака) -->
  <div class="modal-overlay" id="inventoryModal">
    <div class="modal-content wide">
      <div class="modal-header">
        <h3>🎒 Inventory Stock</h3>
        <button class="close-modal" id="closeInventoryModal">✕</button>
      </div>
      <div class="recipe-tabs" id="inventoryTabs">
        <button class="recipe-tab active" onclick="switchInventoryTab('all')">All</button>
        <button class="recipe-tab" onclick="switchInventoryTab('bread')">Bread</button>
        <button class="recipe-tab" onclick="switchInventoryTab('patty')">Patty</button>
        <button class="recipe-tab" onclick="switchInventoryTab('protein')">Protein</button>
        <button class="recipe-tab" onclick="switchInventoryTab('vegetables')">Vegetables</button>
        <button class="recipe-tab" onclick="switchInventoryTab('sauce')">Sauce</button>
      </div>
      <div class="modal-body" id="inventoryModalBody"></div>
    </div>
  </div>

  <!-- Модальное окно Рецептов -->
  <div class="modal-overlay" id="recipesModal">
    <div class="modal-content wide">
      <div class="modal-header">
        <h3>📖 Burger Recipes</h3>
        <button class="close-modal" id="closeRecipesModal">✕</button>
      </div>
      <div class="recipe-tabs">
        <button class="recipe-tab active" id="tabNormal" onclick="switchRecipeTab('regular')">Regular</button>
        <button class="recipe-tab" id="tabSecret" onclick="switchRecipeTab('secret')">Secret</button>
      </div>
      <div class="modal-body" id="recipesModalBody"></div>
    </div>
  </div>

  <!-- Модальное окно Достижений -->
  <div class="modal-overlay" id="achievementsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🏆 Achievements</h3>
        <button class="close-modal" id="closeAchievementsModal">✕</button>
      </div>
      <div class="modal-body" id="achievementsList"></div>
      <div style="margin-top: 10px; text-align: center;">
        <button class="btn-outline-danger" id="resetAchievementsBtn">Reset Achievements</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно Настроек -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ Settings</h3>
        <button class="close-modal" id="closeSettingsModal">✕</button>
      </div>
      <div class="modal-body">
        
        <div class="settings-group">
          <label>Theme</label>
          <div class="settings-row">
            <button id="themeDarkBtn" onclick="setTheme('dark')">Dark 🌙</button>
            <button id="themeLightBtn" onclick="setTheme('light')">Light ☀️</button>
          </div>
        </div>

        <div class="settings-group">
          <label>Game Mode</label>
          <div class="settings-row">
            <button class="speed-btn" id="modeSandboxBtn" data-mode="sandbox">Sandbox ♾️</button>
            <button class="speed-btn active" id="modeCasualBtn" data-mode="casual">Casual 🍔</button>
            <button class="speed-btn" id="modeTurboBtn" data-mode="turbo">Turbo ⚡</button>
          </div>
        </div>

        <div class="settings-group" id="speedSettingsGroup">
          <label>Order Speed / Timer</label>
          <div class="speed-grid" id="speedButtonsGrid">
            <button class="speed-btn" data-speed="no-orders">No Orders</button>
            <button class="speed-btn" data-speed="super-slow">Super Slow</button>
            <button class="speed-btn" data-speed="slow">Slow</button>
            <button class="speed-btn" data-speed="medium">Medium</button>
            <button class="speed-btn" data-speed="fast">Fast</button>
            <button class="speed-btn" data-speed="super-fast">Super Fast</button>
          </div>
        </div>

        <div class="settings-group">
          <label>Volume <span id="volumeVal">100%</span></label>
          <input type="range" id="volumeRange" min="0" max="100" value="100">
        </div>

        <div style="margin-top: 15px;">
          <button class="btn-outline-danger" id="hardResetBtn" style="width: 100%;">⚠️ Hard Reset Data</button>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
