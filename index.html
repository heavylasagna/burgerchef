
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бургер</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }

        .burger {
            position: relative;
            width: 500px;
            height: 500px;
        }

        .burger img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .bottom-bun {
            z-index: 1;
        }

        .patty {
            z-index: 2;
        }

        .top-bun {
            z-index: 3;
        }
    </style>
</head>

<body>

    <div class="burger">
        <img src="images/bottom-bun.png" class="bottom-bun">
        <img src="images/patty.png" class="patty">
        <img src="images/top-bun.png" class="top-bun">
    </div>

</body>
</html>
