<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Burger Builder & Orders</title>
  
  <link rel="icon" type="image/png" href="images/icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 30%, #3e2a1d, #1a100a);
      color: #3e2723;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app-container {
      display: grid;
      grid-template-columns: 220px 1fr 220px;
      grid-template-rows: 1fr 80px;
      height: 100vh;
      width: 100vw;
      gap: 12px;
      padding: 12px;
    }

    .panel {
      background: linear-gradient(145deg, rgba(253, 251, 247, 0.9), rgba(245, 239, 230, 0.75));
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      color: #fdfbf7;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .left-panel {
      grid-column: 1;
      grid-row: 1;
    }

    .layers-list {
      display: flex;
      flex-direction: column-reverse;
      gap: 6px;
      overflow-y: auto;
      flex: 1;
      padding-right: 2px;
    }

    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f5efe6;
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid #e4d8c5;
    }

    .layer-preview {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .layer-controls {
      display: flex;
      gap: 3px;
    }

    .btn-control {
      background: #ffffff;
      border: 1px solid #d7ccc8;
      color: #5d4037;
      width: 24px;
      height: 24px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .btn-control:hover:not(:disabled) {
      background: #8d6e63;
      color: #ffffff;
    }

    .btn-control.delete:hover {
      background: #d32f2f;
      color: #ffffff;
    }

    .btn-control:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .center-stage {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
      padding-bottom: 20px;
      overflow-y: auto; 
      overflow-x: hidden;
      height: 100%;
    }

    .burger-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-height: 100%;
      width: 100%;
      position: relative;
    }

    .burger-stack {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      position: relative;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .burger-stack.eating {
      animation: eatAnimation 2s forwards ease-in-out;
    }

    @keyframes eatAnimation {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      25% { transform: scale(0.75) rotate(-5deg); }
      50% { transform: scale(0.5) rotate(5deg); }
      75% { transform: scale(0.25) rotate(-3deg); }
      100% { transform: scale(0) rotate(0deg); opacity: 0; }
    }

    .burger-layer-img {
      display: block;
      width: auto;
      height: auto;
      max-width: 150px;
      position: relative;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .burger-layer-img.squeezed {
      transform: translateY(var(--sq-offset, 8px)) scaleY(0.82) scaleX(1.04);
    }

    .burger-layer-img.new-layer {
      animation: smoothDropIn 0.35s ease-out forwards;
    }

    @keyframes smoothDropIn {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .crumb {
      position: absolute;
      border-radius: 3px;
      pointer-events: none;
      z-index: 100;
      animation: crumbFly 0.6s ease-out forwards;
    }

    @keyframes crumbFly {
      0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(var(--rot)); }
    }

    .limit-warning {
      position: absolute;
      top: 55px;
      background: #d32f2f;
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 200;
    }
    .limit-warning.show { opacity: 1; transform: translateY(0); }

    .top-order-widget {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(62, 39, 35, 0.92);
      color: #fdfbf7;
      border: 1px solid rgba(255, 179, 0, 0.4);
      border-radius: 14px;
      padding: 6px 16px;
      font-size: 0.8rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      z-index: 150;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: center;
      max-width: 90%;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }
    .top-order-widget.dimmed {
      opacity: 0.35;
    }
    .top-order-widget span { color: #ffb300; font-weight: bold; }

    .pinned-recipe-widget {
      position: absolute;
      top: 55px;
      left: 10px;
      background: rgba(253, 251, 247, 0.9);
      border: 1px solid #d7ccc8;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.75rem;
      max-width: 200px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 50;
      display: none;
    }
    .pinned-recipe-widget.active { display: block; }
    .pinned-recipe-widget h5 { color: #5d4037; margin-bottom: 4px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
    .pinned-recipe-widget .unpin-btn { background: none; border: none; cursor: pointer; font-size: 0.8rem; }
    .pinned-ingredients { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
    .pinned-ingredients img { width: 22px; height: 22px; object-fit: contain; }

    .right-panel {
      grid-column: 3;
      grid-row: 1;
    }

    .ingredients-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      padding-right: 2px;
      align-items: center;
    }

    .ingredient-card {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5efe6;
      border: 1px solid #e4d8c5;
      border-radius: 12px;
      padding: 6px;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ingredient-card:hover {
      background: #ffffff;
      border-color: #a1887f;
      transform: translateY(-1px);
    }

    .ingredient-card.disabled { opacity: 0.4; cursor: not-allowed; }
    .ingredient-card img { width: 42px; height: 42px; object-fit: contain; }

    .bottom-panel {
      grid-column: 1 / -1;
      grid-row: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      background: linear-gradient(145deg, rgba(253, 251, 247, 0.95), rgba(245, 239, 230, 0.88));
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      z-index: 100;
    }

    .sauces-group {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }

    .sauce-chip {
      background: #f5efe6;
      border: 1px solid #d7ccc8;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #5d4037;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-action {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-squeeze { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; }
    .btn-eat { background: linear-gradient(135deg, #689f38, #558b2f); color: #fff; }
    .btn-reset { background: linear-gradient(135deg, #d32f2f, #c62828); color: #fff; }
    .btn-achievements { background: linear-gradient(135deg, #8e24aa, #6a1b9a); color: #fff; }
    .btn-recipes { background: linear-gradient(135deg, #0288d1, #01579b); color: #fff; }
    .btn-utility { background: linear-gradient(135deg, #455a64, #263238); color: #fff; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }

    .modal-content {
      background: #fdfbf7;
      width: 90%;
      max-width: 440px;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid #e4d8c5;
      display: flex;
      flex-direction: column;
      max-height: 80vh;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 2px solid #f5efe6;
      padding-bottom: 8px;
    }
    .modal-header h3 { color: #3e2723; font-size: 1rem; }
    .close-modal { background: none; border: none; font-size: 1.1rem; cursor: pointer; color: #5d4037; }

    .recipe-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .recipe-tab {
      flex: 1;
      padding: 6px;
      background: #f5efe6;
      border: 1px solid #d7ccc8;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      color: #5d4037;
      text-align: center;
    }
    .recipe-tab.active {
      background: #8d6e63;
      color: #fff;
      border-color: #8d6e63;
    }

    .modal-body {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 2px;
      margin-bottom: 12px;
    }

    .recipe-card, .achievement-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f5efe6;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #e4d8c5;
    }
    .recipe-card.locked { opacity: 0.5; }
    .recipe-info h4 { font-size: 0.85rem; color: #3e2723; margin-bottom: 3px; }
    
    .recipe-visual {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      align-items: center;
    }
    .recipe-visual img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      background: rgba(255,255,255,0.6);
      border-radius: 4px;
      padding: 1px;
      border: 1px solid #e4d8c5;
    }

    .btn-pin {
      background: #8d6e63;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-pin.pinned { background: #689f38; }

    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: 400px;
      max-width: 90vw;
    }
    .achievement-toast {
      background: #3e2723;
      color: #fdfbf7;
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      border: 2px solid #81c784;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: toastAnim 3.5s forwards ease-in-out;
    }
    @keyframes toastAnim {
      0% { opacity: 0; transform: translateY(-15px) scale(0.95); }
      15% { opacity: 1; transform: translateY(0) scale(1); }
      85% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-15px) scale(0.95); }
    }

    .toggle-ui-btn { display: none; }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app-container {
        display: flex;
        flex-direction: column;
        height: auto;
        width: 100%;
        padding: 8px;
        gap: 8px;
        padding-bottom: 75px;
      }
      .center-stage { order: 1; min-height: 350px; padding-bottom: 10px; justify-content: flex-end; }
      .right-panel { order: 2; height: 115px; }
      .ingredients-menu {
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 4px;
      }
      .ingredient-card { min-width: 55px; height: 55px; padding: 2px; }
      .ingredient-card img { width: 38px; height: 38px; }

      .sauces-group.desktop-sauces { display: none !important; }
      .sauces-group.mobile-sauces {
        display: flex !important;
        order: 3;
        background: linear-gradient(145deg, rgba(253, 251, 247, 0.9), rgba(245, 239, 230, 0.75));
        border-radius: 10px;
        padding: 6px 10px;
        gap: 6px;
        overflow-x: auto;
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      .left-panel { order: 4; height: 150px; }
      .bottom-panel {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        padding: 8px 12px;
        justify-content: center;
        border-radius: 12px 12px 0 0;
        z-index: 1000;
      }
      .action-group { width: 100%; justify-content: space-between; }
      .btn-action { flex: 1; padding: 8px 2px; font-size: 0.75rem; text-align: center; }

      .toggle-ui-btn {
        position: fixed;
        top: 10px; right: 10px;
        background: rgba(253, 251, 247, 0.9);
        border: 1px solid #d7ccc8;
        color: #5d4037;
        width: 36px; height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        cursor: pointer;
        z-index: 1000;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      }
      body.ui-hidden .left-panel,
      body.ui-hidden .right-panel,
      body.ui-hidden .sauces-group.mobile-sauces { display: none !important; }
      body.ui-hidden .center-stage { min-height: 75vh; }
    }
    @media (min-width: 901px) {
      .sauces-group.mobile-sauces { display: none !important; }
    }
  </style>
</head>
<body>

  <button class="toggle-ui-btn" id="toggleUiBtn" title="Скрыть/показать окна">👁️</button>
  <div class="toast-container" id="toastContainer"></div>

  <div class="top-order-widget" id="topOrderWidget" title="Click to toggle opacity">
    <span id="orderStatusText">Next order in: 05:00</span>
  </div>

  <div class="modal-overlay" id="recipesModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📋 Burger Recipes</h3>
        <button class="close-modal" id="closeRecipesModal">✕</button>
      </div>
      <div class="recipe-tabs">
        <div class="recipe-tab active" id="tabNormal" onclick="switchRecipeTab('regular')">Regular</div>
        <div class="recipe-tab" id="tabSecret" onclick="switchRecipeTab('secret')">Secret</div>
      </div>
      <div class="modal-body" id="recipesModalBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="achievementsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🏆 Achievements</h3>
        <button class="close-modal" id="closeAchievementsModal">✕</button>
      </div>
      <div class="modal-body" id="achievementsList"></div>
      <div style="border-top: 1px solid #f5efe6; padding-top: 8px; display: flex; justify-content: flex-end;">
        <button class="btn-action btn-reset" style="padding: 4px 10px; font-size: 0.75rem;" id="resetAchievementsBtn">Reset</button>
      </div>
    </div>
  </div>

  <div class="app-container">
    <div class="center-stage" id="centerStage">
      <div class="pinned-recipe-widget" id="pinnedRecipeWidget">
        <h5 id="pinnedTitle"><span>📌 Pinned</span> <button class="unpin-btn" id="unpinBtn">✕</button></h5>
        <div class="pinned-ingredients" id="pinnedIngredientsContainer"></div>
      </div>
      <div class="limit-warning" id="limitWarning">Max 30 ingredients!</div>
      <div class="burger-wrapper">
        <div class="burger-stack" id="burgerStack"></div>
      </div>
    </div>

    <div class="panel right-panel">
      <div class="panel-title">Ingredients</div>
      <div class="ingredients-menu" id="ingredientsMenu"></div>
    </div>

    <div class="sauces-group mobile-sauces" id="mobileSaucesGroup"></div>

    <div class="panel left-panel">
      <div class="panel-title" id="layersTitle">Layers (0/30)</div>
      <div class="layers-list" id="layersList"></div>
    </div>

    <div class="bottom-panel">
      <div class="sauces-group desktop-sauces" id="desktopSaucesGroup"></div>
      <div class="action-group">
        <button class="btn-action btn-utility" id="soundToggleBtn" title="Mute/Unmute">🔊</button>
        <button class="btn-action btn-utility" id="downloadPngBtn" title="Download PNG">💾</button>
        <button class="btn-action btn-recipes" id="openRecipesBtn" title="Recipes">📋</button>
        <button class="btn-action btn-achievements" id="openAchievementsBtn" title="Achievements">🏆</button>
        <button class="btn-action btn-squeeze" id="squeezeBtn">Squeeze</button>
        <button class="btn-action btn-eat" id="eatBtn">Eat</button>
        <button class="btn-action btn-reset" id="resetBtn">Reset</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const SOUNDS = {
        eating: new Audio('audio/eating.mp3'),
        sauce: new Audio('audio/sauce.mp3'),
        ingridients: new Audio('audio/ingridients.mp3'),
        buttons: new Audio('audio/buttons.mp3'),
        squeeze: new Audio('audio/squeeze.mp3'),
        achievement: new Audio('audio/achievement.mp3'),
        order: new Audio('audio/order.mp3'),
        complete: new Audio('audio/complete.mp3')
      };

      let isMuted = JSON.parse(localStorage.getItem('burger_is_muted')) || false;
      function updateSoundBtnUI() {
        const btn = document.getElementById('soundToggleBtn');
        if (btn) btn.innerText = isMuted ? '🔇' : '🔊';
      }
      function playSound(sound) {
        if (!isMuted && sound) {
          sound.currentTime = 0;
          sound.play().catch(() => {});
        }
      }
      document.getElementById('soundToggleBtn').onclick = () => {
        isMuted = !isMuted;
        localStorage.setItem('burger_is_muted', JSON.stringify(isMuted));
        updateSoundBtnUI();
        if (!isMuted) playSound(SOUNDS.buttons);
      };

      const topOrderWidget = document.getElementById('topOrderWidget');
      topOrderWidget.onclick = () => {
        topOrderWidget.classList.toggle('dimmed');
      };

      const ITEM_IMAGES = {
        'bottom-bun': 'images/bottom-bun.png',
        'top-bun': 'images/top-bun.png',
        'beef-patty': 'images/beef-patty.png',
        'cheese': 'images/cheese.png',
        'hashbrown': 'images/hashbrown.png',
        'fried-egg': 'images/fried-egg.png',
        'champignons': 'images/champignons.png',
        'fried-bacon': 'images/fried-bacon.png',
        'lettuce': 'images/lettuce.png',
        'tomato': 'images/tomato.png',
        'pickles': 'images/pickles.png',
        'red-onion': 'images/red-onion.png',
        'white-onion': 'images/white-onion.png',
        'chicken-patty': 'images/chicken-patty.png',
        'fish-patty': 'images/fish-patty.png',
        'mayo': 'images/sauce-mayo.png',
        'ketchup': 'images/sauce-ketchup.png',
        'mustard': 'images/sauce-mustard.png',
        'spicy': 'images/sauce-spicy.png',
        'bbq': 'images/sauce-bbq.png'
      };

      const REGULAR_RECIPES = [
        { name: 'Classic Burger', ids: ['bottom-bun', 'beef-patty', 'top-bun'] },
        { name: 'Cheeseburger', ids: ['bottom-bun', 'beef-patty', 'cheese', 'top-bun'] },
        { name: 'Vegan Burger', ids: ['bottom-bun', 'hashbrown', 'lettuce', 'tomato', 'red-onion', 'top-bun'] },
        { name: 'Juicy Burger', ids: ['bottom-bun', 'mayo', 'chicken-patty', 'cheese', 'tomato', 'ketchup', 'top-bun'] },
        { name: 'Breakfast Burger', ids: ['bottom-bun', 'mayo', 'beef-patty', 'fried-egg', 'fried-bacon', 'top-bun'] },
        { name: 'Mushroom Burger', ids: ['bottom-bun', 'bbq', 'beef-patty', 'champignons', 'top-bun'] },
        { name: 'Chicken Burger', ids: ['bottom-bun', 'chicken-patty', 'mayo', 'pickles', 'top-bun'] },
        { name: 'Double Burger', ids: ['bottom-bun', 'beef-patty', 'cheese', 'beef-patty', 'ketchup', 'top-bun'] },
        { name: 'Chicken Delux', ids: ['bottom-bun', 'mayo', 'chicken-patty', 'cheese', 'tomato', 'lettuce', 'pickles', 'top-bun'] },
        { name: 'Stinky Burger', ids: ['bottom-bun', 'mustard', 'chicken-patty', 'white-onion', 'cheese', 'red-onion', 'mustard', 'top-bun'] },
        { name: 'Fish Burger', ids: ['bottom-bun', 'fish-patty', 'mayo', 'pickles', 'lettuce', 'top-bun'] }
      ];

      const SECRET_ACHIEVEMENTS = [
        { id: 'secretMaster', title: 'Master Chef', desc: 'Cooked special stacked creation', icon: '🌟', ids: ['bottom-bun', 'beef-patty', 'cheese', 'hashbrown', 'top-bun'] }
      ];

      let unlockedAchievements = JSON.parse(localStorage.getItem('unlocked_achievements')) || {};
      let pinnedBurger = JSON.parse(localStorage.getItem('pinned_burger')) || null;

      let currentActiveOrder = null; 
      let timeUntilNextOrder = Math.floor(Math.random() * 240) + 60;

      function unlockAchievement(id) {
        if (!unlockedAchievements[id]) {
          unlockedAchievements[id] = true;
          localStorage.setItem('unlocked_achievements', JSON.stringify(unlockedAchievements));
          const ach = SECRET_ACHIEVEMENTS.find(a => a.id === id);
          if (ach) {
            playSound(SOUNDS.achievement);
            showToast(ach);
          }
        }
      }

      function showToast(ach) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'achievement-toast';
        toast.innerHTML = `<span style="font-size: 1.8rem;">${ach.icon}</span><div><h4 style="font-size:0.85rem">Achievement Unlocked!</h4><p style="font-size:0.75rem">${ach.title}</p></div>`;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
      }

      let activeRecipeTab = 'regular';
      window.switchRecipeTab = function(tab) {
        activeRecipeTab = tab;
        document.getElementById('tabNormal').className = `recipe-tab ${tab === 'regular' ? 'active' : ''}`;
        document.getElementById('tabSecret').className = `recipe-tab ${tab === 'secret' ? 'active' : ''}`;
        renderRecipesModal();
      }

      function renderRecipesModal() {
        const body = document.getElementById('recipesModalBody');
        body.innerHTML = '';

        if (activeRecipeTab === 'regular') {
          REGULAR_RECIPES.forEach(r => {
            const card = document.createElement('div');
            card.className = 'recipe-card';
            
            let iconsHtml = '';
            r.ids.forEach(id => {
              if (ITEM_IMAGES[id]) iconsHtml += `<img src="${ITEM_IMAGES[id]}" title="${id}">`;
            });

            card.innerHTML = `
              <div class="recipe-info">
                <h4>${r.name}</h4>
                <div class="recipe-visual">${iconsHtml}</div>
              </div>`;
            
            const pinBtn = document.createElement('button');
            const isPinned = pinnedBurger && pinnedBurger.name === r.name;
            pinBtn.className = `btn-pin ${isPinned ? 'pinned' : ''}`;
            pinBtn.innerText = '📌';
            pinBtn.onclick = () => togglePin(r.name, r.ids);
            card.appendChild(pinBtn);
            body.appendChild(card);
          });
        } else {
          SECRET_ACHIEVEMENTS.forEach(ach => {
            const isUnlocked = unlockedAchievements[ach.id];
            const card = document.createElement('div');
            card.className = `recipe-card ${isUnlocked ? '' : 'locked'}`;

            if (isUnlocked) {
              let iconsHtml = '';
              ach.ids.forEach(id => {
                if (ITEM_IMAGES[id]) iconsHtml += `<img src="${ITEM_IMAGES[id]}" title="${id}">`;
              });
              card.innerHTML = `
                <div class="recipe-info" style="flex:1;">
                  <h4>${ach.title}</h4>
                  <div class="recipe-visual">${iconsHtml}</div>
                </div>`;
              
              const pinBtn = document.createElement('button');
              const isPinned = pinnedBurger && pinnedBurger.name === ach.title;
              pinBtn.className = `btn-pin ${isPinned ? 'pinned' : ''}`;
              pinBtn.innerText = '📌';
              pinBtn.onclick = () => togglePin(ach.title, ach.ids);
              card.appendChild(pinBtn);
            } else {
              card.innerHTML = `
                <div class="recipe-info" style="flex:1;">
                  <h4>${ach.title}</h4>
                  <p style="font-size:0.75rem; color:#6d4c41;">Secret recipe locked...</p>
                </div>`;
            }
            body.appendChild(card);
          });
        }
      }

      function togglePin(name, ids) {
        if (pinnedBurger && pinnedBurger.name === name) {
          pinnedBurger = null;
          localStorage.removeItem('pinned_burger');
        } else {
          pinnedBurger = { name, ids };
          localStorage.setItem('pinned_burger', JSON.stringify(pinnedBurger));
        }
        renderRecipesModal();
        updatePinnedWidget();
      }

      function updatePinnedWidget() {
        const widget = document.getElementById('pinnedRecipeWidget');
        const container = document.getElementById('pinnedIngredientsContainer');
        if (pinnedBurger) {
          document.getElementById('pinnedTitle').innerHTML = `<span>📌 ${pinnedBurger.name}</span> <button class="unpin-btn" id="unpinBtn">✕</button>`;
          container.innerHTML = '';
          pinnedBurger.ids.forEach(id => {
            if (ITEM_IMAGES[id]) {
              const img = document.createElement('img');
              img.src = ITEM_IMAGES[id];
              container.appendChild(img);
            }
          });
          widget.classList.add('active');
          document.getElementById('unpinBtn').onclick = () => {
            pinnedBurger = null;
            localStorage.removeItem('pinned_burger');
            updatePinnedWidget();
            renderRecipesModal();
          };
        } else {
          widget.classList.remove('active');
        }
      }

      function renderAchievementsModal() {
        const list = document.getElementById('achievementsList');
        list.innerHTML = '';
        SECRET_ACHIEVEMENTS.forEach(ach => {
          const isUnlocked = unlockedAchievements[ach.id];
          const item = document.createElement('div');
          item.className = 'achievement-item';
          item.style.opacity = isUnlocked ? '1' : '0.5';
          item.innerHTML = `
            <div class="recipe-info" style="flex:1;">
              <h4>${ach.title}</h4>
              <p>${isUnlocked ? ach.desc : 'Secret locked'}</p>
            </div>
          `;
          list.appendChild(item);
        });
      }

      const recipesModal = document.getElementById('recipesModal');
      document.getElementById('openRecipesBtn').onclick = () => { playSound(SOUNDS.buttons); renderRecipesModal(); recipesModal.classList.add('open'); };
      document.getElementById('closeRecipesModal').onclick = () => { playSound(SOUNDS.buttons); recipesModal.classList.remove('open'); };
      recipesModal.onclick = (e) => { if (e.target === recipesModal) recipesModal.classList.remove('open'); };

      const achievementsModal = document.getElementById('achievementsModal');
      document.getElementById('openAchievementsBtn').onclick = () => { playSound(SOUNDS.buttons); renderAchievementsModal(); achievementsModal.classList.add('open'); };
      document.getElementById('closeAchievementsModal').onclick = () => { playSound(SOUNDS.buttons); achievementsModal.classList.remove('open'); };
      achievementsModal.onclick = (e) => { if (e.target === achievementsModal) achievementsModal.classList.remove('open'); };
      document.getElementById('resetAchievementsBtn').onclick = () => {
        if(confirm('Reset achievements?')) {
          unlockedAchievements = {};
          localStorage.removeItem('unlocked_achievements');
          renderAchievementsModal();
          renderRecipesModal();
        }
      };

      const toggleUiBtn = document.getElementById('toggleUiBtn');
      toggleUiBtn.onclick = () => {
        document.body.classList.toggle('ui-hidden');
        toggleUiBtn.innerText = document.body.classList.contains('ui-hidden') ? '👁️‍🗨️' : '👁️';
      };

      function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }

      setInterval(() => {
        const statusText = document.getElementById('orderStatusText');
        if (!currentActiveOrder) {
          if (timeUntilNextOrder > 0) {
            timeUntilNextOrder--;
            statusText.innerHTML = `Next order in: <span>${formatTime(timeUntilNextOrder)}</span>`;
          } else {
            triggerRandomOrder();
          }
        }
      }, 1000);

      function triggerRandomOrder() {
        const unlockedSecretNames = SECRET_ACHIEVEMENTS.filter(a => unlockedAchievements[a.id]);
        const allAvailable = [...REGULAR_RECIPES, ...unlockedSecretNames];
        const chosen = allAvailable[Math.floor(Math.random() * allAvailable.length)];
        
        currentActiveOrder = { name: chosen.name || chosen.title, ids: chosen.ids };
        const statusText = document.getElementById('orderStatusText');
        statusText.innerHTML = `🔔 Order: <span>${currentActiveOrder.name}</span>`;
        playSound(SOUNDS.order);
      }

      const MAX_INGREDIENTS = 30;
      const INGREDIENTS = [
        { id: 'top-bun', name: 'Top Bun', image: 'images/top-bun.png' },
        { id: 'cheese', name: 'Cheese', image: 'images/cheese.png' },
        { id: 'fried-egg', name: 'Fried Egg', image: 'images/fried-egg.png' },
        { id: 'champignons', name: 'Champignons', image: 'images/champignons.png' },
        { id: 'fried-bacon', name: 'Fried Bacon', image: 'images/fried-bacon.png' },
        { id: 'lettuce', name: 'Lettuce', image: 'images/lettuce.png' },
        { id: 'tomato', name: 'Tomato', image: 'images/tomato.png' },
        { id: 'pickles', name: 'Pickles', image: 'images/pickles.png' },
        { id: 'red-onion', name: 'Red Onion', image: 'images/red-onion.png' },
        { id: 'white-onion', name: 'White Onion', image: 'images/white-onion.png' },
        { id: 'hashbrown', name: 'Hashbrown', image: 'images/hashbrown.png' },
        { id: 'beef-patty', name: 'Beef Patty', image: 'images/beef-patty.png' },
        { id: 'chicken-patty', name: 'Chicken Patty', image: 'images/chicken-patty.png' },
        { id: 'fish-patty', name: 'Fish Patty', image: 'images/fish-patty.png' },
        { id: 'bottom-bun', name: 'Bottom Bun', image: 'images/bottom-bun.png' }
      ];

      const SAUCES = [
        { id: 'mayo', name: '⚪️ Mayo', image: 'images/sauce-mayo.png' },
        { id: 'ketchup', name: '🔴 Ketchup', image: 'images/sauce-ketchup.png' },
        { id: 'mustard', name: '🟡 Mustard', image: 'images/sauce-mustard.png' },
        { id: 'spicy', name: '🟠 Spicy', image: 'images/sauce-spicy.png' },
        { id: 'bbq', name: '🟤 BBQ', image: 'images/sauce-bbq.png' }
      ];

      let currentBurger = JSON.parse(localStorage.getItem('saved_burger_stack')) || [];
      let isEating = false;
      let isSqueezed = false;

      function saveBurgerState() {
        localStorage.setItem('saved_burger_stack', JSON.stringify(currentBurger));
      }

      const burgerStack = document.getElementById('burgerStack');
      const layersList = document.getElementById('layersList');
      const layersTitle = document.getElementById('layersTitle');
      const ingredientsMenu = document.getElementById('ingredientsMenu');
      const desktopSaucesGroup = document.getElementById('desktopSaucesGroup');
      const mobileSaucesGroup = document.getElementById('mobileSaucesGroup');
      const centerStage = document.getElementById('centerStage');
      const limitWarning = document.getElementById('limitWarning');

      function renderIngredientsMenu() {
        ingredientsMenu.innerHTML = '';
        INGREDIENTS.forEach(item => {
          const card = document.createElement('div');
          card.className = 'ingredient-card';
          if (currentBurger.length >= MAX_INGREDIENTS || isEating) card.classList.add('disabled');
          card.innerHTML = `<img src="${item.image}" alt="${item.name}">`;
          card.onclick = () => { if (!isEating) addIngredient(item); };
          ingredientsMenu.appendChild(card);
        });
      }

      function renderSauces() {
        desktopSaucesGroup.innerHTML = '';
        mobileSaucesGroup.innerHTML = '';
        SAUCES.forEach(sauce => {
          [desktopSaucesGroup, mobileSaucesGroup].forEach(container => {
            const chip = document.createElement('div');
            chip.className = 'sauce-chip';
            chip.innerText = sauce.name;
            chip.onclick = () => { if (!isEating) addSauce(sauce); };
            container.appendChild(chip);
          });
        });
      }

      function checkOrderCompletion(ids) {
        if (!currentActiveOrder) return;
        const targetIds = currentActiveOrder.ids;
        if (ids.length === targetIds.length && ids.every((val, idx) => val === targetIds[idx])) {
          playSound(SOUNDS.complete);
          
          const toast = document.createElement('div');
          toast.className = 'achievement-toast';
          toast.innerHTML = `<span style="font-size: 1.8rem;">🎉</span><div><h4 style="font-size:0.9rem">The order is complete!</h4><p style="font-size:0.75rem">${currentActiveOrder.name} served successfully</p></div>`;
          document.getElementById('toastContainer').appendChild(toast);
          setTimeout(() => toast.remove(), 4000);

          currentActiveOrder = null;
          timeUntilNextOrder = Math.floor(Math.random() * 240) + 60;

          setTimeout(() => {
            triggerEatAnimation();
          }, 600);
        }
      }

      function checkSpecialCombos() {
        if (currentBurger.length === 0) return;
        const ids = currentBurger.map(i => i.id);

        if (ids.length === 5 && ids[0] === 'bottom-bun' && ids[1] === 'beef-patty' && ids[2] === 'cheese' && ids[3] === 'hashbrown' && ids[4] === 'top-bun') {
          unlockAchievement('secretMaster');
        }

        checkOrderCompletion(ids);
      }

      function getMarginBottomForLayer(item, itemBelow, index) {
        const isSauce = ['mayo', 'ketchup', 'mustard', 'spicy', 'bbq'].includes(item.id);
        if (index === 0) return -10;
        if (isSauce) return -30;
        if (item.id === 'top-bun') return -38;
        if (item.id === 'cheese') return -60;
        if (item.id === 'hashbrown') return -38;
        if (item.id === 'fried-egg') return -52;
        if (item.id === 'fried-bacon') return -48;
        if (item.id === 'lettuce') return -65;
        if (itemBelow && itemBelow.id === 'lettuce') return -50;
        return -38;
      }

      function updateBurgerDisplay(isNewAdded = false) {
        saveBurgerState();
        layersTitle.innerText = `Layers (${currentBurger.length}/${MAX_INGREDIENTS})`;

        layersList.innerHTML = '';
        currentBurger.forEach((item, index) => {
          const listItem = document.createElement('div');
          listItem.className = 'layer-item';
          listItem.innerHTML = `
            <div class="layer-info">${item.image ? `<img src="${item.image}" class="layer-preview">` : ''}</div>
            <div class="layer-controls">
              <button class="btn-control" onclick="moveLayer(${index}, 1)" ${index === currentBurger.length - 1 || isEating ? 'disabled' : ''}>▲</button>
              <button class="btn-control" onclick="moveLayer(${index}, -1)" ${index === 0 || isEating ? 'disabled' : ''}>▼</button>
              <button class="btn-control delete" onclick="removeLayer(${index})" ${isEating ? 'disabled' : ''}>✕</button>
            </div>
          `;
          layersList.appendChild(listItem);
        });

        burgerStack.innerHTML = '';
        currentBurger.forEach((item, index) => {
          if (item.image) {
            const img = document.createElement('img');
            img.src = item.image;
            img.className = 'burger-layer-img';
            if (isNewAdded && index === currentBurger.length - 1) {
              img.classList.add('new-layer');
              setTimeout(() => img.classList.remove('new-layer'), 350);
            }
            const itemBelow = index > 0 ? currentBurger[index - 1] : null;
            img.style.marginBottom = `${getMarginBottomForLayer(item, itemBelow, index)}px`;
            img.style.zIndex = index + 1;

            if (isSqueezed && index > 0) {
              img.style.setProperty('--sq-offset', `${index * 6}px`);
              img.classList.add('squeezed');
            }
            burgerStack.appendChild(img);
          }
        });
        renderIngredientsMenu();
        setTimeout(() => { centerStage.scrollTop = centerStage.scrollHeight; }, 50);
      }

      function showLimitWarning() {
        limitWarning.classList.add('show');
        setTimeout(() => limitWarning.classList.remove('show'), 2000);
      }

      function addIngredient(item) {
        if (currentBurger.length >= MAX_INGREDIENTS) { showLimitWarning(); return; }
        playSound(SOUNDS.ingridients);
        currentBurger.push({ ...item });
        checkSpecialCombos();
        updateBurgerDisplay(true);
      }

      function addSauce(sauce) {
        if (currentBurger.length >= MAX_INGREDIENTS) { showLimitWarning(); return; }
        playSound(SOUNDS.sauce);
        currentBurger.push({ ...sauce });
        checkSpecialCombos();
        updateBurgerDisplay(true);
      }

      window.removeLayer = function(index) {
        if (isEating) return;
        playSound(SOUNDS.buttons);
        currentBurger.splice(index, 1);
        checkSpecialCombos();
        updateBurgerDisplay(false);
      };

      window.moveLayer = function(index, direction) {
        if (isEating) return;
        const targetIndex = index + direction;
        if (targetIndex >= 0 && targetIndex < currentBurger.length) {
          playSound(SOUNDS.buttons);
          const temp = currentBurger[index];
          currentBurger[index] = currentBurger[targetIndex];
          currentBurger[targetIndex] = temp;
          checkSpecialCombos();
          updateBurgerDisplay(false);
        }
      };

      document.getElementById('squeezeBtn').onclick = () => {
        if (currentBurger.length <= 1 || isEating) return;
        playSound(SOUNDS.squeeze);
        isSqueezed = !isSqueezed;
        updateBurgerDisplay(false);
      };

      document.getElementById('resetBtn').onclick = () => {
        playSound(SOUNDS.buttons);
        isEating = false; isSqueezed = false;
        burgerStack.classList.remove('eating');
        currentBurger = [];
        updateBurgerDisplay(false);
      };

      function spawnCrumbs() {
        const colors = ['#e0a96d', '#8d6e63', '#d7ccc8', '#ffd54f', '#81c784'];
        const rect = burgerStack.getBoundingClientRect();
        const originX = rect.left + rect.width / 2;
        const originY = rect.top + rect.height / 2;
        for (let i = 0; i < 12; i++) {
          const crumb = document.createElement('div');
          crumb.className = 'crumb';
          const size = Math.floor(Math.random() * 6) + 4;
          crumb.style.width = `${size}px`; crumb.style.height = `${size}px`;
          crumb.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          crumb.style.left = `${originX}px`; crumb.style.top = `${originY}px`;
          crumb.style.setProperty('--dx', (Math.random() - 0.5) * 160 + 'px');
          crumb.style.setProperty('--dy', (Math.random() - 0.5) * 160 + 'px');
          crumb.style.setProperty('--rot', (Math.random() - 0.5) * 360 + 'deg');
          document.body.appendChild(crumb);
          setTimeout(() => crumb.remove(), 600);
        }
      }

      function triggerEatAnimation() {
        if (currentBurger.length === 0 || isEating) return;
        playSound(SOUNDS.eating);
        isEating = true; isSqueezed = false;
        burgerStack.classList.add('eating');
        spawnCrumbs();
        renderIngredientsMenu();
        setTimeout(() => {
          currentBurger = [];
          burgerStack.classList.remove('eating');
          isEating = false;
          updateBurgerDisplay(false);
        }, 2000);
      }

      document.getElementById('eatBtn').onclick = triggerEatAnimation;

      document.getElementById('downloadPngBtn').onclick = async () => {
        if (currentBurger.length === 0) { alert('Build a burger first!'); return; }
        playSound(SOUNDS.buttons);
        const imagesInStack = burgerStack.querySelectorAll('.burger-layer-img');
        if (imagesInStack.length === 0) return;

        const loadedImages = await Promise.all(currentBurger.map(item => new Promise((resolve) => {
          const img = new Image(); img.src = item.image;
          img.onload = () => resolve(img); img.onerror = () => resolve(null);
        })));

        const layerRects = Array.from(imagesInStack).map(imgEl => imgEl.getBoundingClientRect());
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        layerRects.forEach(rect => {
          if (rect.left < minX) minX = rect.left;
          if (rect.top < minY) minY = rect.top;
          if (rect.right > maxX) maxX = rect.right;
          if (rect.bottom > maxY) maxY = rect.bottom;
        });

        const scale = 2, padding = 40;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = ((maxX - minX) + padding * 2) * scale;
        canvas.height = ((maxY - minY) + padding * 2) * scale;
        ctx.scale(scale, scale);

        loadedImages.forEach((img, index) => {
          if (!img) return;
          const rect = layerRects[index];
          ctx.drawImage(img, (rect.left - minX) + padding, (rect.top - minY) + padding, rect.width, rect.height);
        });

        const link = document.createElement('a');
        link.download = 'my-burger.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };

      updateSoundBtnUI();
      renderSauces();
      renderIngredientsMenu();
      updateBurgerDisplay(false);
      updatePinnedWidget();
    });
  </script>
</body>
</html>
