<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор Бургеров</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f4f6f8;
      color: #333;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .app-container {
      display: grid;
      grid-template-columns: 240px 1fr 240px;
      grid-template-rows: 1fr 110px;
      height: 100vh;
      width: 100vw;
      gap: 20px;
      padding: 20px;
    }

    .panel {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #eef1f5;
      padding: 18px;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 15px;
      text-align: center;
      color: #2c3e50;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Левая панель */
    .left-panel {
      grid-column: 1;
      grid-row: 1;
      overflow: hidden;
    }

    .layers-list {
      display: flex;
      flex-direction: column-reverse;
      gap: 10px;
      overflow-y: auto;
      flex: 1;
      padding-right: 5px;
    }

    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      transition: background 0.2s;
    }

    .layer-item:hover {
      background: #f1f5f9;
    }

    .layer-preview {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .layer-controls {
      display: flex;
      gap: 4px;
    }

    .btn-control {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #64748b;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-control:hover:not(:disabled) {
      background: #3b82f6;
      color: #ffffff;
      border-color: #3b82f6;
    }

    .btn-control.delete:hover {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
    }

    .btn-control:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Центральная область */
    .center-stage {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
      padding-bottom: 50px;
      overflow-y: auto; 
      overflow-x: hidden;
    }

    .burger-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-height: 100%;
      width: 100%;
      position: relative;
    }

    .burger-stack {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      position: relative;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    /* Анимация плавного уменьшения и исчезновения */
    .burger-stack.eating {
      animation: eatAnimation 2s forwards ease-in-out;
    }

    @keyframes eatAnimation {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      25% { transform: scale(0.75) rotate(-5deg); }
      50% { transform: scale(0.5) rotate(5deg); }
      75% { transform: scale(0.25) rotate(-3deg); }
      100% { transform: scale(0) rotate(0deg); opacity: 0; }
    }

    .burger-layer-img {
      display: block;
      width: auto;
      height: auto;
      max-width: 200px;
      position: relative;
    }

    .layer-bottom-bun { margin-bottom: -30px; }
    .layer-beef-patty { margin-bottom: -48px; }
    .layer-top-bun { margin-bottom: -52px; }
    .layer-default { margin-bottom: -44px; }

    .limit-warning {
      position: absolute;
      top: 15px;
      background: #ef4444;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 200;
    }
    .limit-warning.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Правая панель */
    .right-panel {
      grid-column: 3;
      grid-row: 1;
      overflow: hidden;
    }

    .ingredients-menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      flex: 1;
      padding-right: 5px;
      align-items: center;
    }

    .ingredient-card {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 10px;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ingredient-card:hover {
      background: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.12);
      transform: translateY(-2px);
    }

    .ingredient-card.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .ingredient-card img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    /* Нижняя панель */
    .bottom-panel {
      grid-column: 1 / -1;
      grid-row: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      z-index: 100;
      background: #ffffff;
    }

    .sauces-group {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
    }

    .sauce-chip {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .sauce-chip:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .action-group {
      display: flex;
      gap: 12px;
    }

    .btn-action {
      padding: 12px 26px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-eat {
      background: #10b981;
      color: #ffffff;
    }

    .btn-eat:hover {
      background: #059669;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .btn-reset {
      background: #f43f5e;
      color: #ffffff;
    }

    .btn-reset:hover {
      background: #e11d48;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.25);
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="panel left-panel">
      <div class="panel-title" id="layersTitle">Слои (0/10)</div>
      <div class="layers-list" id="layersList"></div>
    </div>

    <div class="center-stage" id="centerStage">
      <div class="limit-warning" id="limitWarning">Максимум 10 ингредиентов!</div>
      <div class="burger-wrapper">
        <div class="burger-stack" id="burgerStack"></div>
      </div>
    </div>

    <div class="panel right-panel">
      <div class="panel-title">Ингредиенты</div>
      <div class="ingredients-menu" id="ingredientsMenu"></div>
    </div>

    <div class="panel bottom-panel">
      <div class="sauces-group" id="saucesGroup">
        <span style="font-size: 0.9rem; font-weight:600; color: #94a3b8; margin-right: 5px;">Соусы:</span>
      </div>
      <div class="action-group">
        <button class="btn-action btn-eat" id="eatBtn">Съесть 😋</button>
        <button class="btn-action btn-reset" id="resetBtn">Сброс 🗑️</button>
      </div>
    </div>
  </div>

  <script>
    const MAX_INGREDIENTS = 10;

    const INGREDIENTS = [
      { id: 'top-bun', name: 'Верхняя булочка', image: 'images/top-bun.png' },
      { id: 'beef-patty', name: 'Говяжья котлета', image: 'images/beef-patty.png' },
      { id: 'bottom-bun', name: 'Нижняя булочка', image: 'images/bottom-bun.png' }
    ];

    const SAUCES = [
      { id: 'ketchup', name: 'Кетчуп 🥫' },
      { id: 'mayo', name: 'Майонез 🤍' },
      { id: 'mustard', name: 'Горчица 🟡' },
      { id: 'bbq', name: 'Барбекю 🍖' }
    ];

    let currentBurger = [
      { ...INGREDIENTS.find(item => item.id === 'bottom-bun') },
      { ...INGREDIENTS.find(item => item.id === 'beef-patty') },
      { ...INGREDIENTS.find(item => item.id === 'top-bun') }
    ];

    let isEating = false;

    const burgerStack = document.getElementById('burgerStack');
    const layersList = document.getElementById('layersList');
    const layersTitle = document.getElementById('layersTitle');
    const ingredientsMenu = document.getElementById('ingredientsMenu');
    const saucesGroup = document.getElementById('saucesGroup');
    const centerStage = document.getElementById('centerStage');
    const limitWarning = document.getElementById('limitWarning');

    function renderIngredientsMenu() {
      ingredientsMenu.innerHTML = '';
      INGREDIENTS.forEach(item => {
        const card = document.createElement('div');
        card.className = 'ingredient-card';
        if (currentBurger.length >= MAX_INGREDIENTS || isEating) {
          card.classList.add('disabled');
        }
        card.innerHTML = `<img src="${item.image}" alt="${item.name}">`;
        card.onclick = () => {
          if (isEating) return;
          addIngredient(item);
        };
        ingredientsMenu.appendChild(card);
      });
    }

    function renderSauces() {
      saucesGroup.querySelectorAll('.sauce-chip').forEach(el => el.remove());
      SAUCES.forEach(sauce => {
        const chip = document.createElement('div');
        chip.className = 'sauce-chip';
        chip.innerText = sauce.name;
        chip.onclick = () => {
          if (isEating) return;
          addSauce(sauce);
        };
        saucesGroup.appendChild(chip);
      });
    }

    function updateBurgerDisplay() {
      layersTitle.innerText = `Слои (${currentBurger.length}/${MAX_INGREDIENTS})`;

      // 1. Обновляем левую панель слоев
      layersList.innerHTML = '';
      currentBurger.forEach((item, index) => {
        const listItem = document.createElement('div');
        listItem.className = 'layer-item';
        listItem.innerHTML = `
          <div class="layer-info">
            ${item.image ? `<img src="${item.image}" class="layer-preview">` : ''}
          </div>
          <div class="layer-controls">
            <button class="btn-control" onclick="moveLayer(${index}, 1)" ${index === currentBurger.length - 1 || isEating ? 'disabled' : ''}>▲</button>
            <button class="btn-control" onclick="moveLayer(${index}, -1)" ${index === 0 || isEating ? 'disabled' : ''}>▼</button>
            <button class="btn-control delete" onclick="removeLayer(${index})" ${isEating ? 'disabled' : ''}>✕</button>
          </div>
        `;
        layersList.appendChild(listItem);
      });

      // 2. Отрисовываем бургер по центру
      burgerStack.innerHTML = '';
      currentBurger.forEach((item, index) => {
        if (item.image) {
          const img = document.createElement('img');
          img.src = item.image;
          img.className = `burger-layer-img ${getSpacingClass(item.id)}`;
          img.style.zIndex = index + 1;
          burgerStack.appendChild(img);
        }
      });

      renderIngredientsMenu();

      setTimeout(() => {
        centerStage.scrollTop = centerStage.scrollHeight;
      }, 50);
    }

    function getSpacingClass(id) {
      if (id === 'bottom-bun') return 'layer-bottom-bun';
      if (id === 'beef-patty') return 'layer-beef-patty';
      if (id === 'top-bun') return 'layer-top-bun';
      return 'layer-default';
    }

    function showLimitWarning() {
      limitWarning.classList.add('show');
      setTimeout(() => limitWarning.classList.remove('show'), 2000);
    }

    function addIngredient(item) {
      if (currentBurger.length >= MAX_INGREDIENTS) {
        showLimitWarning();
        return;
      }
      currentBurger.push({ ...item });
      updateBurgerDisplay();
    }

    function addSauce(sauce) {
      if (currentBurger.length >= MAX_INGREDIENTS) {
        showLimitWarning();
        return;
      }
      currentBurger.push({ id: sauce.id, name: `Соус: ${sauce.name}` });
      updateBurgerDisplay();
    }

    function removeLayer(index) {
      if (isEating) return;
      currentBurger.splice(index, 1);
      updateBurgerDisplay();
    }

    function moveLayer(index, direction) {
      if (isEating) return;
      const targetIndex = index + direction;
      if (targetIndex >= 0 && targetIndex < currentBurger.length) {
        const temp = currentBurger[index];
        currentBurger[index] = currentBurger[targetIndex];
        currentBurger[targetIndex] = temp;
        updateBurgerDisplay();
      }
    }

    // Кнопка Сброс
    document.getElementById('resetBtn').onclick = () => {
      isEating = false;
      burgerStack.classList.remove('eating');
      currentBurger = [];
      updateBurgerDisplay();
    };

    // Кнопка Съесть
    document.getElementById('eatBtn').onclick = () => {
      if (currentBurger.length === 0 || isEating) return;

      isEating = true;
      burgerStack.classList.add('eating');
      renderIngredientsMenu();

      setTimeout(() => {
        currentBurger = [];
        burgerStack.classList.remove('eating');
        isEating = false;
        updateBurgerDisplay();
      }, 2000);
    };

    renderSauces();
    updateBurgerDisplay();
  </script>
</body>
</html>
