```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собери свой бургер!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #fff4df;
            color: #4b3024;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .panel {
            background: #fffaf0;
            border: 2px solid #e8d1aa;
            border-radius: 15px;
            padding: 15px;
            min-width: 0;
        }

        h2 {
            text-align: center;
            font-size: 20px;
            margin-top: 0;
        }

        /* Список ингредиентов */

        #ingredient-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ingredient-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px;
            background: #f8e8cb;
            border-radius: 10px;
        }

        .ingredient-item img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .ingredient-name {
            flex: 1;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .ingredient-controls {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .ingredient-controls button {
            width: 27px;
            height: 25px;
            padding: 0;
            border: none;
            border-radius: 5px;
            background: #e6c79c;
            cursor: pointer;
        }

        .ingredient-controls button:hover {
            background: #d7b27d;
        }

        .delete-button {
            width: 27px;
            height: 27px;
            border: none;
            border-radius: 5px;
            background: #e9a18b;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #df8066;
        }

        /* Бургер */

        .burger-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #burger {
            position: relative;
            width: 300px;
            height: 300px;
            max-width: 100%;
            overflow: hidden;
            flex-shrink: 0;
        }

        .burger-layer {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .sauce-layer {
            position: absolute;
            left: 5%;
            top: 42%;
            width: 90%;
            height: 30px;
            font-size: 55px;
            font-weight: bold;
            line-height: 20px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            pointer-events: none;
        }

        .reset-button {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #a95d35;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .reset-button:hover {
            background: #874525;
        }

        /* Соусы */

        .sauces {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .sauce-button {
            padding: 8px 10px;
            border: 1px solid #e0c49a;
            border-radius: 8px;
            background: #fff0d5;
            cursor: pointer;
            font-size: 14px;
        }

        .sauce-button:hover {
            background: #f2d8ac;
        }

        /* Каталог */

        .catalog {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
            padding: 5px;
        }

        .catalog-item {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 115px;
            padding: 8px;
            background: #f8e8cb;
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
        }

        .catalog-item:hover {
            border-color: #c78a51;
            background: #f3ddb9;
        }

        .catalog-item img {
            width: 100%;
            height: 100px;
            object-fit: contain;
            pointer-events: none;
        }

        /* Телефоны */

        @media (max-width: 800px) {
            body {
                padding: 12px;
            }

            .container {
                grid-template-columns: 1fr;
            }

            #burger {
                width: 300px;
                height: 300px;
            }

            .catalog {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                max-height: 350px;
            }
        }

        @media (max-width: 420px) {
            .catalog {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>

    <h1>Собери свой бургер!</h1>

    <div class="container">

        <!-- Список ингредиентов -->
        <section class="panel">
            <h2>Твой бургер</h2>
            <div id="ingredient-list"></div>
        </section>

        <!-- Собранный бургер -->
        <section class="panel burger-panel">
            <h2>Результат</h2>

            <div id="burger"></div>

            <div class="sauces">
                <button class="sauce-button" data-sauce="ketchup">🍅 Кетчуп</button>
                <button class="sauce-button" data-sauce="mayo">🥚 Майонез</button>
                <button class="sauce-button" data-sauce="mustard">🌭 Горчица</button>
                <button class="sauce-button" data-sauce="bbq">🍖 Барбекю</button>
                <button class="sauce-button" data-sauce="chili">🌶️ Чили</button>
            </div>

            <button class="reset-button" id="reset-button">
                Начать заново
            </button>
        </section>

        <!-- Каталог ингредиентов -->
        <section class="panel">
            <h2>Ингредиенты</h2>
            <div class="catalog" id="catalog"></div>
        </section>

    </div>

    <script>
        const ingredients = [
            {
                name: "Нижняя булочка",
                file: "images/bottom-bun.png",
                type: "bread"
            },
            {
                name: "Котлета",
                file: "images/patty.png",
                type: "meat"
            },
            {
                name: "Сыр",
                file: "images/cheese.png",
                type: "cheese"
            },
            {
                name: "Салат",
                file: "images/lettuce.png",
                type: "vegetable"
            },
            {
                name: "Помидор",
                file: "images/tomato.png",
                type: "vegetable"
            },
            {
                name: "Лук",
                file: "images/onion.png",
                type: "vegetable"
            },
            {
                name: "Огурец",
                file: "images/pickles.png",
                type: "vegetable"
            },
            {
                name: "Бекон",
                file: "images/bacon.png",
                type: "meat"
            },
            {
                name: "Верхняя булочка",
                file: "images/top-bun.png",
                type: "bread"
            }
        ];

        const sauceColors = {
            ketchup: "#d62828",
            mayo: "#fff0c2",
            mustard: "#e8b923",
            bbq: "#713b24",
            chili: "#f04424"
        };

        const sauceNames = {
            ketchup: "Кетчуп",
            mayo: "Майонез",
            mustard: "Горчица",
            bbq: "Соус барбекю",
            chili: "Соус чили"
        };

        // Ингредиенты расположены снизу вверх.
        let burgerLayers = [
            {
                name: "Нижняя булочка",
                file: "images/bottom-bun.png",
                type: "bread"
            },
            {
                name: "Котлета",
                file: "images/patty.png",
                type: "meat"
            },
            {
                name: "Верхняя булочка",
                file: "images/top-bun.png",
                type: "bread"
            }
        ];

        const catalog = document.getElementById("catalog");
        const burger = document.getElementById("burger");
        const ingredientList = document.getElementById("ingredient-list");

        // Создание каталога.
        function renderCatalog() {
            catalog.innerHTML = "";

            ingredients.forEach(function (item) {
                const card = document.createElement("div");
                card.className = "catalog-item";
                card.title = item.name;

                const image = document.createElement("img");
                image.src = item.file;
                image.alt = item.name;

                image.onerror = function () {
                    image.style.display = "none";
                };

                card.appendChild(image);

                card.addEventListener("click", function () {
                    addIngredient(item);
                });

                catalog.appendChild(card);
            });
        }

        // Добавление ингредиента.
        function addIngredient(item) {
            burgerLayers.push({
                name: item.name,
                file: item.file,
                type: item.type
            });

            renderBurger();
            renderIngredientList();
        }

        // Добавление соуса.
        function addSauce(sauce) {
            burgerLayers.push({
                name: sauceNames[sauce],
                type: "sauce",
                color: sauceColors[sauce]
            });

            renderBurger();
            renderIngredientList();
        }

        // Отрисовка бургера.
        function renderBurger() {
            burger.innerHTML = "";

            burgerLayers.forEach(function (item, index) {
                const layer = document.createElement(
                    item.type === "sauce" ? "div" : "img"
                );

                if (item.type === "sauce") {
                    layer.className = "sauce-layer";
                    layer.style.color = item.color;
                    layer.textContent = "〰";
                } else {
                    layer.className = "burger-layer";
                    layer.src = item.file;
                    layer.alt = item.name;

                    layer.onerror = function () {
                        layer.style.display = "none";
                    };
                }

                layer.style.zIndex = index + 1;

                // Расстояние между слоями.
                // Чем больше число, тем сильнее смещаются верхние слои.
                const layerOffset = 80;

                layer.style.transform =
                    "translateY(-" + (index * layerOffset) + "px)";

                burger.appendChild(layer);
            });
        }

        // Список ингредиентов с кнопками управления.
        function renderIngredientList() {
            ingredientList.innerHTML = "";

            burgerLayers.forEach(function (item, index) {
                const row = document.createElement("div");
                row.className = "ingredient-item";

                if (item.type === "sauce") {
                    const sauceIcon = document.createElement("div");
                    sauceIcon.style.width = "50px";
                    sauceIcon.style.height = "50px";
                    sauceIcon.style.display = "flex";
                    sauceIcon.style.alignItems = "center";
                    sauceIcon.style.justifyContent = "center";
                    sauceIcon.style.color = item.color;
                    sauceIcon.style.fontSize = "28px";
                    sauceIcon.textContent = "〰";

                    row.appendChild(sauceIcon);
                } else {
                    const image = document.createElement("img");
                    image.src = item.file;
                    image.alt = item.name;

                    image.onerror = function () {
                        image.style.visibility = "hidden";
                    };

                    row.appendChild(image);
                }

                const name = document.createElement("span");
                name.className = "ingredient-name";
                name.textContent = item.name;

                row.appendChild(name);

                const controls = document.createElement("div");
                controls.className = "ingredient-controls";

                const upButton = document.createElement("button");
                upButton.textContent = "↑";
                upButton.title = "Поднять слой";
                upButton.disabled = index === burgerLayers.length - 1;

                upButton.addEventListener("click", function () {
                    if (index < burgerLayers.length - 1) {
                        const temp = burgerLayers[index];

                        burgerLayers[index] = burgerLayers[index + 1];
                        burgerLayers[index + 1] = temp;

                        renderBurger();
                        renderIngredientList();
                    }
                });

                const downButton = document.createElement("button");
                downButton.textContent = "↓";
                downButton.title = "Опустить слой";
                downButton.disabled = index === 0;

                downButton.addEventListener("click", function () {
                    if (index > 0) {
                        const temp = burgerLayers[index];

                        burgerLayers[index] = burgerLayers[index - 1];
                        burgerLayers[index - 1] = temp;

                        renderBurger();
                        renderIngredientList();
                    }
                });

                controls.appendChild(upButton);
                controls.appendChild(downButton);

                row.appendChild(controls);

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-button";
                deleteButton.textContent = "×";
                deleteButton.title = "Удалить ингредиент";

                deleteButton.addEventListener("click", function () {
                    burgerLayers.splice(index, 1);

                    renderBurger();
                    renderIngredientList();
                });

                row.appendChild(deleteButton);
                ingredientList.appendChild(row);
            });
        }

        // Обработчики кнопок соусов.
        document.querySelectorAll(".sauce-button").forEach(function (button) {
            button.addEventListener("click", function () {
                addSauce(button.dataset.sauce);
            });
        });

        // Сброс бургера.
        document.getElementById("reset-button").addEventListener("click", function () {
            burgerLayers = [
                {
                    name: "Нижняя булочка",
                    file: "images/bottom-bun.png",
                    type: "bread"
                },
                {
                    name: "Котлета",
                    file: "images/patty.png",
                    type: "meat"
                },
                {
                    name: "Верхняя булочка",
                    file: "images/top-bun.png",
                    type: "bread"
                }
            ];

            renderBurger();
            renderIngredientList();
        });

        // Первый запуск.
        renderCatalog();
        renderBurger();
        renderIngredientList();
    </script>

</body>
</html>
```
