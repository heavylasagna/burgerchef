<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Maker</title>
  <link rel="stylesheet" href="style.css">
  <!-- Подключаем html2canvas для скачивания бургера в PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <!-- Мобильная верхняя панель (глаз, кнопки гриля/доски) -->
  <div class="mobile-top-bar">
    <div class="mobile-custom-buttons-container">
      <button class="nav-arrow-btn" title="Действие 🍳">🍳</button>
      <button class="nav-arrow-btn" title="Действие 🔪">🔪</button>
    </div>
    <button id="toggleUiBtn" class="toggle-ui-btn">👁️</button>
  </div>

  <div class="app-container">

    <!-- Левая панель: Сложенные слои бургера -->
    <div class="panel left-panel" id="leftPanel">
      <h3 class="panel-title" id="layersTitle">Layers (0/30)</h3>
      <div class="layers-list" id="layersList">
        <!-- Динамически заполняется слоями -->
      </div>
    </div>

    <!-- Центральная сцена: Бургер, кошелек, таймер заказов и закрепленный рецепт -->
    <div class="center-stage" id="centerStage">
      
      <!-- Виджет кошелька -->
      <div class="wallet-widget" id="walletWidget">
        <span>💰 Wallet:</span>
        <span id="walletBadge">$100.00</span>
      </div>

      <!-- Контейнер для всплывающих уведомлений о деньгах -->
      <div id="moneyPopupContainer" class="money-popup-container"></div>

      <!-- Верхний виджет текущего заказа / таймера -->
      <div class="top-order-widget hidden" id="topOrderWidget">
        <div id="orderStatusText">🔔 Order: <span>None</span></div>
      </div>

      <!-- Закрепленный рецепт -->
      <div class="pinned-recipe-widget" id="pinnedRecipeWidget">
        <h5 id="pinnedTitle">✕</h5>
        <div class="pinned-ingredients" id="pinnedIngredientsContainer"></div>
      </div>

      <!-- Предупреждение о лимите -->
      <div class="limit-warning" id="limitWarning">Max 30 ingredients reached!</div>

      <!-- Сборка бургера -->
      <div class="burger-wrapper">
        <div class="burger-stack" id="burgerStack">
          <!-- Слои бургера -->
        </div>
      </div>
    </div>

    <!-- Правая панель: Меню ингредиентов -->
    <div class="panel right-panel" id="rightPanel">
      <h3 class="panel-title">Ingredients</h3>
      <div class="ingredients-menu" id="ingredientsMenu">
        <!-- Динамически заполняется ингредиентами -->
      </div>
    </div>

    <!-- Нижняя панель: Соусы и основные кнопки управления (единственная зафиксированная снизу) -->
    <div class="panel bottom-panel" id="bottomPanel">
      <div class="sauces-group desktop-sauces" id="desktopSaucesGroup">
        <!-- Десктопные соусы -->
      </div>
      
      <div class="sauces-group mobile-sauces" id="mobileSaucesGroup" style="display:none;">
        <!-- Мобильные соусы -->
      </div>

      <div class="action-group">
        <button class="btn-action" id="squeezeBtn" title="Сжать бургер">🗜️ Сжать</button>
        <button class="btn-action" id="eatBtn" title="Съесть бургер">😋 Съесть</button>
        <button class="btn-action" id="submitOrderBtn" style="display:none;" title="Отдать заказ">✅ Отдать</button>
        <button class="btn-action" id="openShopBtn" title="Магазин">🛒 Магазин</button>
        <button class="btn-action" id="openRecipesBtn" title="Рецепты">📖 Рецепты</button>
        <button class="btn-action" id="openAchievementsBtn" title="Достижения">🏆 Достижения</button>
        <button class="btn-action" id="openSettingsBtn" title="Настройки">⚙️ Настройки</button>
        <button class="btn-action" id="downloadPngBtn" title="Скачать PNG">📷 Фото</button>
        <button class="btn-outline-danger" id="resetBtn" title="Очистить">🗑️ Сброс</button>
      </div>
    </div>

  </div>

  <!-- Окно магазина -->
  <div class="modal-overlay" id="shopModal">
    <div class="modal-content wide">
      <div class="modal-header">
        <h3>🛒 Ingredient Shop</h3>
        <button class="close-modal" id="closeShopModal">✕</button>
      </div>
      <div class="recipe-tabs" id="shopTabs">
        <button class="recipe-tab active" onclick="switchShopTab('all')">All</button>
        <button class="recipe-tab" onclick="switchShopTab('bread')">Bread</button>
        <button class="recipe-tab" onclick="switchShopTab('patty')">Patty</button>
        <button class="recipe-tab" onclick="switchShopTab('protein')">Protein</button>
        <button class="recipe-tab" onclick="switchShopTab('vegetables')">Veg</button>
        <button class="recipe-tab" onclick="switchShopTab('sauce')">Sauce</button>
      </div>
      <div class="modal-body" id="shopModalBody"></div>
    </div>
  </div>

  <!-- Окно рецептов -->
  <div class="modal-overlay" id="recipesModal">
    <div class="modal-content wide">
      <div class="modal-header">
        <h3>📖 Recipe Book</h3>
        <button class="close-modal" id="closeRecipesModal">✕</button>
      </div>
      <div class="recipe-tabs">
        <button class="recipe-tab active" id="tabNormal" onclick="switchRecipeTab('regular')">Regular</button>
        <button class="recipe-tab" id="tabSecret" onclick="switchRecipeTab('secret')">Secret</button>
      </div>
      <div class="modal-body" id="recipesModalBody"></div>
    </div>
  </div>

  <!-- Окно достижений -->
  <div class="modal-overlay" id="achievementsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🏆 Achievements</h3>
        <button class="close-modal" id="closeAchievementsModal">✕</button>
      </div>
      <div class="modal-body" id="achievementsList"></div>
      <button class="btn-outline-danger" id="resetAchievementsBtn" style="width:100%; margin-top:8px;">Reset Achievements</button>
    </div>
  </div>

  <!-- Окно настроек -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>⚙️ Settings</h3>
        <button class="close-modal" id="closeSettingsModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-group">
          <label>🎨 Theme</label>
          <div class="settings-row">
            <button id="themeDarkBtn" class="active" onclick="setTheme('dark')">Dark</button>
            <button id="themeLightBtn" onclick="setTheme('light')">Light</button>
          </div>
        </div>

        <div class="settings-group">
          <label>🎮 Game Mode</label>
          <div class="settings-row">
            <button id="modeSandboxBtn" class="active">Sandbox</button>
            <button id="modeCasualBtn">Casual</button>
            <button id="modeTurboBtn">Turbo</button>
          </div>
        </div>

        <div class="settings-group" id="speedSettingsGroup">
          <label>⏱️ Order Speed Preset</label>
          <div class="speed-grid" id="speedButtonsGrid">
            <button class="speed-btn" data-speed="no-orders">No Orders</button>
            <button class="speed-btn active" data-speed="turbo-fixed">Turbo (Fast)</button>
            <button class="speed-btn" data-speed="super-fast">Super Fast</button>
            <button class="speed-btn" data-speed="fast">Fast</button>
            <button class="speed-btn" data-speed="medium">Medium</button>
            <button class="speed-btn" data-speed="slow">Slow</button>
          </div>
        </div>

        <div class="settings-group">
          <label>🔊 Volume <span id="volumeVal">100%</span></label>
          <input type="range" id="volumeRange" min="0" max="100" value="100">
        </div>

        <button class="btn-outline-danger" id="hardResetBtn" style="margin-top: 10px; width: 100%;">⚠️ Hard Reset All Data</button>
      </div>
    </div>
  </div>

  <!-- Контейнер для уведомлений -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="script.js"></script>
</body>
</html>
