<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Burger Builder & Orders</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 30%, #3e2a1d, #1a100a);
      color: #3e2723;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app-container {
      display: grid;
      grid-template-columns: 220px 1fr 220px;
      grid-template-rows: 1fr 80px;
      height: 100vh;
      width: 100vw;
      gap: 12px;
      padding: 12px;
    }

    .panel {
      background: linear-gradient(145deg, rgba(253, 251, 247, 0.9), rgba(245, 239, 230, 0.75));
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
      color: #fdfbf7;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .left-panel {
      grid-column: 1;
      grid-row: 1;
    }

    .layers-list {
      display: flex;
      flex-direction: column-reverse;
      gap: 6px;
      overflow-y: auto;
      flex: 1;
      padding-right: 2px;
    }

    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f5efe6;
      padding: 4px 8px;
      border-radius: 10px;
      border: 1px solid #e4d8c5;
    }

    .layer-preview {
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .layer-controls {
      display: flex;
      gap: 3px;
    }

    .btn-control {
      background: #ffffff;
      border: 1px solid #d7ccc8;
      color: #5d4037;
      width: 24px;
      height: 24px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .btn-control:hover:not(:disabled) {
      background: #8d6e63;
      color: #ffffff;
    }

    .btn-control.delete:hover {
      background: #d32f2f;
      color: #ffffff;
    }

    .btn-control:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .center-stage {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      position: relative;
      padding-bottom: 20px;
      overflow-y: auto; 
      overflow-x: hidden;
      height: 100%;
    }

    .burger-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      min-height: 100%;
      width: 100%;
      position: relative;
    }

    .burger-stack {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      position: relative;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .burger-stack.eating {
      animation: eatAnimation 2s forwards ease-in-out;
    }

    @keyframes eatAnimation {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      25% { transform: scale(0.75) rotate(-5deg); }
      50% { transform: scale(0.5) rotate(5deg); }
      75% { transform: scale(0.25) rotate(-3deg); }
      100% { transform: scale(0) rotate(0deg); opacity: 0; }
    }

    .burger-layer-img {
      display: block;
      width: auto;
      height: auto;
      max-width: 150px;
      position: relative;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .burger-layer-img.squeezed {
      transform: translateY(var(--sq-offset, 6px)) scaleY(0.82) scaleX(1.04);
    }

    .burger-layer-img.new-layer {
      animation: smoothDropIn 0.35s ease-out forwards;
    }

    @keyframes smoothDropIn {
      0% { opacity: 0; transform: translateY(-20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .crumb {
      position: absolute;
      border-radius: 3px;
      pointer-events: none;
      z-index: 100;
      animation: crumbFly 0.6s ease-out forwards;
    }

    @keyframes crumbFly {
      0% { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(var(--rot)); }
    }

    .limit-warning {
      position: absolute;
      top: 10px;
      background: #d32f2f;
      color: #fff;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 200;
    }
    .limit-warning.show { opacity: 1; transform: translateY(0); }

    .pinned-recipe-widget {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(253, 251, 247, 0.9);
      border: 1px solid #d7ccc8;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.75rem;
      max-width: 200px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 50;
      display: none;
    }
    .pinned-recipe-widget.active { display: block; }
    .pinned-recipe-widget h5 { color: #5d4037; margin-bottom: 3px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
    .pinned-recipe-widget p { color: #6d4c41; line-height: 1.2; }
    .pinned-recipe-widget .unpin-btn { background: none; border: none; cursor: pointer; font-size: 0.8rem; }

    .right-panel {
      grid-column: 3;
      grid-row: 1;
    }

    .ingredients-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
      padding-right: 2px;
      align-items: center;
    }

    .ingredient-card {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5efe6;
      border: 1px solid #e4d8c5;
      border-radius: 12px;
      padding: 6px;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s;
    }

    .ingredient-card:hover {
      background: #ffffff;
      border-color: #a1887f;
      transform: translateY(-1px);
    }

    .ingredient-card.disabled { opacity: 0.4; cursor: not-allowed; }
    .ingredient-card img { width: 42px; height: 42px; object-fit: contain; }

    .bottom-panel {
      grid-column: 1 / -1;
      grid-row: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      background: linear-gradient(145deg, rgba(253, 251, 247, 0.95), rgba(245, 239, 230, 0.88));
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      z-index: 100;
    }

    .sauces-group {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }

    .sauce-chip {
      background: #f5efe6;
      border: 1px solid #d7ccc8;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #5d4037;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-action {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-squeeze { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; }
    .btn-eat { background: linear-gradient(135deg, #689f38, #558b2f); color: #fff; }
    .btn-reset { background: linear-gradient(135deg, #d32f2f, #c62828); color: #fff; }
    .btn-achievements { background: linear-gradient(135deg, #8e24aa, #6a1b9a); color: #fff; }
    .btn-recipes { background: linear-gradient(135deg, #0288d1, #01579b); color: #fff; }
    .btn-utility { background: linear-gradient(135deg, #455a64, #263238); color: #fff; }

    .order-popup {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-50px);
      background: #3e2723;
      color: #fdfbf7;
      padding: 12px 20px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 2px solid #ffb300;
      z-index: 4000;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .order-popup.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }
    .order-popup h4 { color: #ffb300; font-size: 0.9rem; }
    .order-popup p { font-size: 0.95rem; font-weight: bold; text-align: center; }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.open { opacity: 1; visibility: visible; }

    .modal-content {
      background: #fdfbf7;
      width: 90%;
      max-width: 420px;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid #e4d8c5;
      display: flex;
      flex-direction: column;
      max-height: 80vh;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 2px solid #f5efe6;
      padding-bottom: 8px;
    }
    .modal-header h3 { color: #3e2723; font-size: 1rem; }
    .close-modal { background: none; border: none; font-size: 1.1rem; cursor: pointer; color: #5d4037; }

    .modal-body {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 2px;
      margin-bottom: 12px;
    }

    .recipe-section-title {
      font-size: 0.8rem;
      font-weight: bold;
      color: #8d6e63;
      text-transform: uppercase;
      margin-top: 6px;
      border-bottom: 1px dashed #d7ccc8;
      padding-bottom: 3px;
    }

    .recipe-card, .achievement-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f5efe6;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #e4d8c5;
    }
    .recipe-card.locked { opacity: 0.5; }
    .recipe-info h4 { font-size: 0.85rem; color: #3e2723; }
    .recipe-info p { font-size: 0.75rem; color: #6d4c41; }

    .btn-pin {
      background: #8d6e63;
      color: #fff;
      border: none;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
    }
    .btn-pin.pinned { background: #689f38; }

    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: 400px;
      max-width: 90vw;
    }
    .achievement-toast {
      background: #3e2723;
      color: #fdfbf7;
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      border: 1px solid #81c784;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: toastAnim 3.5s forwards ease-in-out;
    }
    @keyframes toastAnim {
      0% { opacity: 0; transform: translateY(-15px) scale(0.95); }
      15% { opacity: 1; transform: translateY(0) scale(1); }
      85% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-15px) scale(0.95); }
    }

    .toggle-ui-btn { display: none; }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .app-container {
        display: flex;
        flex-direction: column;
        height: auto;
        width: 100%;
        padding: 8px;
        gap: 8px;
        padding-bottom: 75px;
      }
      .center-stage { order: 1; min-height: 350px; padding-bottom: 10px; justify-content: flex-end; }
      .right-panel { order: 2; height: 115px; }
      .ingredients-menu {
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 4px;
      }
      .ingredient-card { min-width: 55px; height: 55px; padding: 2px; }
      .ingredient-card img { width: 38px; height: 38px; }

      .sauces-group.desktop-sauces { display: none !important; }
      .sauces-group.mobile-sauces {
        display: flex !important;
        order: 3;
        background: linear-gradient(145deg, rgba(253, 251, 247, 0.9), rgba(245, 239, 230, 0.75));
        border-radius: 10px;
        padding: 6px 10px;
        gap: 6px;
        overflow-x: auto;
        border: 1px solid rgba(255, 255, 255, 0.4);
      }
      .left-panel { order: 4; height: 150px; }
      .bottom-panel {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        padding: 8px 12px;
        justify-content: center;
        border-radius: 12px 12px 0 0;
        z-index: 1000;
      }
      .action-group { width: 100%; justify-content: space-between; }
      .btn-action { flex: 1; padding: 8px 2px; font-size: 0.75rem; text-align: center; }

      .toggle-ui-btn {
        position: fixed;
        top: 10px; right: 10px;
        background: rgba(253, 251, 247, 0.9);
        border: 1px solid #d7ccc8;
        color: #5d4037;
        width: 36px; height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        cursor: pointer;
        z-index: 1000;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      }
      body.ui-hidden .left-panel,
      body.ui-hidden .right-panel,
      body.ui-hidden .sauces-group.mobile-sauces { display: none !important; }
      body.ui-hidden .center-stage { min-height: 75vh; }
    }
    @media (min-width: 901px) {
      .sauces-group.mobile-sauces { display: none !important; }
    }
  </style>
</head>
<body>

  <button class="toggle-ui-btn" id="toggleUiBtn" title="Скрыть/показать окна">👁️</button>
  <div class="toast-container" id="toastContainer"></div>

  <div class="order-popup" id="orderPopup">
    <h4>🔔 New Order!</h4>
    <p id="orderText">Burger Name</p>
  </div>

  <div class="modal-overlay" id="recipesModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📋 Burger Recipes</h3>
        <button class="close-modal" id="closeRecipesModal">✕</button>
      </div>
      <div class="modal-body" id="recipesModalBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="achievementsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>🏆 Achievements</h3>
        <button class="close-modal" id="closeAchievementsModal">✕</button>
      </div>
      <div class="modal-body" id="achievementsList"></div>
      <div style="border-top: 1px solid #f5efe6; padding-top: 8px; display: flex; justify-content: flex-end;">
        <button class="btn-action btn-reset" style="padding: 4px 10px; font-size: 0.75rem;" id="resetAchievementsBtn">Reset</button>
      </div>
    </div>
  </div>

  <div class="app-container">
    <div class="center-stage" id="centerStage">
      <div class="pinned-recipe-widget" id="pinnedRecipeWidget">
        <h5 id="pinnedTitle"><span>📌 Recipe</span> <button class="unpin-btn" id="unpinBtn">✕</button></h5>
        <p id="pinnedText">Recipe details...</p>
      </div>
      <div class="limit-warning" id="limitWarning">Max 30 ingredients!</div>
      <div class="burger-wrapper">
        <div class="burger-stack" id="burgerStack"></div>
      </div>
    </div>

    <div class="panel right-panel">
      <div class="panel-title">Ingredients</div>
      <div class="ingredients-menu" id="ingredientsMenu"></div>
    </div>

    <div class="sauces-group mobile-sauces" id="mobileSaucesGroup"></div>

    <div class="panel left-panel">
      <div class="panel-title" id="layersTitle">Layers (0/30)</div>
      <div class="layers-list" id="layersList"></div>
    </div>

    <div class="bottom-panel">
      <div class="sauces-group desktop-sauces" id="desktopSaucesGroup"></div>
      <div class="action-group">
        <button class="btn-action btn-utility" id="soundToggleBtn" title="Mute/Unmute">🔊</button>
        <button class="btn-action btn-utility" id="downloadPngBtn" title="Download PNG">💾</button>
        <button class="btn-action btn-recipes" id="openRecipesBtn" title="Recipes">📋</button>
        <button class="btn-action btn-achievements" id="openAchievementsBtn" title="Achievements">🏆</button>
        <button class="btn-action btn-squeeze" id="squeezeBtn">Squeeze</button>
        <button class="btn-action btn-eat" id="eatBtn">Eat</button>
        <button class="btn-action btn-reset" id="resetBtn">Reset</button>
      </div>
    </div>
  </div>

  <script>
    const SOUNDS = {
      eating: new Audio('audio/eating.mp3'),
      sauce: new Audio('audio/sauce.mp3'),
      ingridients: new Audio('audio/ingridients.mp3'),
      buttons: new Audio('audio/buttons.mp3'),
      squeeze: new Audio('audio/squeeze.mp3'),
      achievement: new Audio('audio/achievement.mp3')
    };

    let isMuted = JSON.parse(localStorage.getItem('burger_is_muted')) || false;
    function updateSoundBtnUI() {
      const btn = document.getElementById('soundToggleBtn');
      if (btn) btn.innerText = isMuted ? '🔇' : '🔊';
    }
    function playSound(sound) {
      if (!isMuted && sound) {
        sound.currentTime = 0;
        sound.play().catch(() => {});
      }
    }
    document.getElementById('soundToggleBtn').onclick = () => {
      isMuted = !isMuted;
      localStorage.setItem('burger_is_muted', JSON.stringify(isMuted));
      updateSoundBtnUI();
      if (!isMuted) playSound(SOUNDS.buttons);
    };

    const NORMAL_RECIPES = [
      { name: 'Simple Burger', recipe: 'Bottom Bun + Beef Patty + Top Bun' },
      { name: 'Egg & Bacon Deluxe', recipe: 'Bottom Bun + Beef Patty + Fried Egg + Fried Bacon + Top Bun' },
      { name: 'Mushroom Melt', recipe: 'Bottom Bun + Beef Patty + Champignons + Cheese + Top Bun' }
    ];

    const SECRET_ACHIEVEMENTS = [
      { id: 'cheeseburger', title: 'Cheezburger', desc: 'Ideal Roblox burger', icon: '🧀', recipe: 'Bottom Bun + Beef Patty + Cheese + Top Bun' },
      { id: 'mcPicklePounder', title: 'McPickle Pounder', desc: 'Pickle lover dream', icon: '🥒', recipe: 'Bottom Bun + Beef Patty + Cheese + 3x Pickles + Top Bun' },
      { id: 'tomatonator', title: 'Tomatonator', desc: 'Tomato fanatic', icon: '🍅', recipe: 'Bottom Bun + Beef Patty + Cheese + 3x Tomato + Top Bun' },
      { id: 'saturnBurger', title: 'Saturn Burger', desc: 'Space flavor', icon: '🪐', recipe: 'Bottom Bun + Beef Patty + White Onion + Top Bun' },
      { id: 'lilypad', title: 'Lilypad', desc: 'Almost vegan', icon: '🥬', recipe: 'Bottom Bun + Beef Patty + Cheese + Lettuce + Top Bun' },
      { id: 'bustanator', title: 'Bustanator', desc: 'Mayo overload', icon: '💦', recipe: 'Bottom Bun + Beef Patty + 3x Mayo + Top Bun' },
      { id: 'toothless', title: 'Toothless', desc: 'All sauces combined', icon: '🍼', recipe: 'Bottom Bun + All 5 Sauces + Top Bun' }
    ];

    let unlockedAchievements = JSON.parse(localStorage.getItem('unlocked_achievements')) || {};
    let pinnedRecipe = JSON.parse(localStorage.getItem('pinned_recipe')) || null;

    function unlockAchievement(id) {
      if (!unlockedAchievements[id]) {
        unlockedAchievements[id] = true;
        localStorage.setItem('unlocked_achievements', JSON.stringify(unlockedAchievements));
        const ach = SECRET_ACHIEVEMENTS.find(a => a.id === id);
        if (ach) {
          playSound(SOUNDS.achievement);
          showToast(ach);
        }
      }
    }

    function showToast(ach) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'achievement-toast';
      toast.innerHTML = `<span style="font-size: 1.8rem;">${ach.icon}</span><div><h4 style="font-size:0.85rem">Achievement Unlocked!</h4><p style="font-size:0.75rem">${ach.title}</p></div>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    }

    function renderRecipesModal() {
      const body = document.getElementById('recipesModalBody');
      body.innerHTML = '';

      const normalTitle = document.createElement('div');
      normalTitle.className = 'recipe-section-title';
      normalTitle.innerText = '🍔 Normal Burgers (Known)';
      body.appendChild(normalTitle);

      NORMAL_RECIPES.forEach(r => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        card.innerHTML = `<div class="recipe-info"><h4>${r.name}</h4><p>${r.recipe}</p></div>`;
        const pinBtn = document.createElement('button');
        pinBtn.className = `btn-pin ${pinnedRecipe === r.recipe ? 'pinned' : ''}`;
        pinBtn.innerText = pinnedRecipe === r.recipe ? 'Pinned' : '📌 Pin';
        pinBtn.onclick = () => togglePin(r.name, r.recipe);
        card.appendChild(pinBtn);
        body.appendChild(card);
      });

      const secretTitle = document.createElement('div');
      secretTitle.className = 'recipe-section-title';
      secretTitle.innerText = '🔒 Secret Burgers (Unlock via achievements)';
      body.appendChild(secretTitle);

      SECRET_ACHIEVEMENTS.forEach(ach => {
        const isUnlocked = unlockedAchievements[ach.id];
        const card = document.createElement('div');
        card.className = `recipe-card ${isUnlocked ? '' : 'locked'}`;
        card.innerHTML = `
          <div style="font-size: 1.4rem; margin-right: 8px;">${isUnlocked ? ach.icon : '🔒'}</div>
          <div class="recipe-info" style="flex:1;">
            <h4>${ach.title}</h4>
            <p>${isUnlocked ? ach.recipe : 'Secret recipe locked...'}</p>
          </div>
        `;
        if (isUnlocked) {
          const pinBtn = document.createElement('button');
          pinBtn.className = `btn-pin ${pinnedRecipe === ach.recipe ? 'pinned' : ''}`;
          pinBtn.innerText = pinnedRecipe === ach.recipe ? 'Pinned' : '📌 Pin';
          pinBtn.onclick = () => togglePin(ach.title, ach.recipe);
          card.appendChild(pinBtn);
        }
        body.appendChild(card);
      });
    }

    function togglePin(title, recipe) {
      if (pinnedRecipe === recipe) {
        pinnedRecipe = null;
        localStorage.removeItem('pinned_recipe');
      } else {
        pinnedRecipe = `${title}: ${recipe}`;
        localStorage.setItem('pinned_recipe', JSON.stringify(pinnedRecipe));
      }
      renderRecipesModal();
      updatePinnedWidget();
    }

    function updatePinnedWidget() {
      const widget = document.getElementById('pinnedRecipeWidget');
      if (pinnedRecipe) {
        document.getElementById('pinnedText').innerText = pinnedRecipe;
        widget.classList.add('active');
      } else {
        widget.classList.remove('active');
      }
    }
    document.getElementById('unpinBtn').onclick = () => {
      pinnedRecipe = null;
      localStorage.removeItem('pinned_recipe');
      updatePinnedWidget();

    function checkSpecialCombos() {
      if (currentBurger.length === 0) return;
      const ids = currentBurger.map(i => i.id);

      if (ids.length === 4 && ids[0] === 'bottom-bun' && ids[1] === 'beef-patty' && ids[2] === 'cheese' && ids[3] === 'top-bun') unlockAchievement('cheeseburger');
      else if (ids.length === 7 && ids[0] === 'bottom-bun' && ids[1] === 'beef-patty' && ids[2] === 'cheese' && ids[3] === 'pickles' && ids[4] === 'pickles' && ids[5] === 'pickles' && ids[6] === 'top-bun') unlockAchievement('mcPicklePounder');
      else if (ids.length === 7 && ids[0] === 'bottom-bun' && ids[1] === 'beef-patty' && ids[2] === 'cheese' && ids[3] === 'tomato' && ids[4] === 'tomato' && ids[5] === 'tomato' && ids[6] === 'top-bun') unlockAchievement('tomatonator');
      else if (ids.length === 4 && ids[0] === 'bottom-bun' && ids[1] === 'beef-patty' && ids[2] === 'white-onion' && ids[3] === 'top-bun') unlockAchievement('saturnBurger');
      else if (ids.length === 5 && ids[0] === 'bottom-bun' && ids[1] === 'beef-patty' && ids[2] === 'cheese' && ids[3] === 'lettuce' && ids[4] === 'top-bun') unlockAchievement('lilypad');
      else if (ids.length === 6 && ids[0] === 'bottom-bun' && ids[1] === 'beef-patty' && ids[2] === 'mayo' && ids[3] === 'mayo' && ids[4] === 'mayo' && ids[5] === 'top-bun') unlockAchievement('bustanator');
      else if (ids.length === 7 && ids[0] === 'bottom-bun' && ids[6] === 'top-bun') {
        const middleLayers = ids.slice(1, 6);
        const requiredSauces = ['ketchup', 'mustard', 'mayo', 'bbq', 'spicy'];
        if (requiredSauces.every(s => middleLayers.includes(s)) && middleLayers.length === requiredSauces.length) {
          unlockAchievement('toothless');
        }
      }
    }

    function getMarginBottomForLayer(item, itemBelow, index) {
