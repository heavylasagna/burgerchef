
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор бургера</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Конструктор бургера</h1>
    </header>

    <main class="layout">

        <section class="panel ingredients-panel">
            <h2>Мой бургер</h2>
            <div id="ingredients-list"></div>
        </section>

        <section class="panel burger-panel">

            <div class="burger-area">
                <div id="burger-stack" class="burger-stack"></div>
            </div>

            <div class="sauce-buttons">
                <button data-sauce="ketchup">Кетчуп</button>
                <button data-sauce="mayonnaise">Майонез</button>
                <button data-sauce="mustard">Горчица</button>
                <button data-sauce="bbq">Барбекю</button>
                <button data-sauce="chili">Чили</button>
            </div>

            <div class="action-buttons">
                <button id="save-button">Сохранить</button>
                <button id="eat-button">Съесть</button>
                <button id="reset-button">Сбросить</button>
            </div>

            <p id="message"></p>

        </section>

        <section class="panel catalog-panel">
            <h2>Ингредиенты</h2>
            <div id="catalog"></div>
        </section>

    </main>

</body>
</html>
