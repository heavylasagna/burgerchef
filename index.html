<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Builder Game</title>
  <link rel="stylesheet" href="style.css">
  <!-- Подключаем html2canvas для сохранения PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <div class="app-container">
    
    <!-- Левая панель: Слои бургера / Готовые ингредиенты гриля -->
    <aside class="panel left-panel" id="leftPanel">
      <h3 class="panel-title">Layers (0/30)</h3>
      <div class="layers-list" id="layersList"></div>
    </aside>

    <!-- Центральная сцена: Сборка бургера или Гриль -->
    <main class="panel center-stage" id="centerStage">
      <div class="burger-wrapper">
        <div class="limit-warning" id="limitWarning">Limit reached (30 items)!</div>
        <div class="burger-stack" id="burgerStack"></div>
      </div>
    </main>

    <!-- Экран гриля (скрыт по умолчанию) -->
    <div class="grill-stage" id="grillStage" style="display: none; grid-column: 2; grid-row: 1;">
      <div class="grill-cooking-area" id="grillCookingArea">
        <!-- Слот для кнопок подтверждения ведра в правом нижнем углу -->
        <div id="binConfirmBar" class="bin-confirm-bar" style="display: none;">
          <button class="btn-action btn-confirm" title="Confirm" onclick="confirmBinGrillItems()">✔</button>
          <button class="btn-action btn-cancel" title="Cancel" onclick="exitBinSelectMode()">✖</button>
        </div>
      </div>
    </div>

    <!-- Правая панель: Ингредиенты -->
    <aside class="panel right-panel" id="rightPanel">
      <h3 class="panel-title">Ingredients</h3>
      <div class="ingredients-menu" id="ingredientsMenu"></div>
    </aside>

    <!-- Нижняя панель управления -->
    <footer class="panel bottom-panel" id="bottomPanel">
      <div class="sauces-group desktop-sauces" id="desktopSaucesGroup"></div>
      <div class="actions-wrapper">
        <div class="action-box">
          <button class="btn-action" id="eatBtn" title="Eat Burger">🍔</button>
          <button class="btn-action" id="squeezeBtn" title="Squeeze Burger">✊</button>
        </div>
        <div class="action-box">
          <button class="btn-action" id="submitOrderBtn" title="Submit Order">▶️</button>
          <button class="btn-action" id="forceOrderBtn" title="Summon Order">🔔</button>
          <button class="btn-action" id="skipOrderBtn" title="Skip Order">⏭️</button>
          <button class="btn-action" id="resetBtn" title="Bin">🗑️</button>
        </div>
      </div>
    </footer>

  </div>

  <!-- Мобильные соусы -->
  <div class="mobile-sauces" id="mobileSaucesGroup"></div>

  <!-- Виджеты сверху -->
  <div class="wallet-widget" id="walletWidget">
    <span>💰</span> <span id="walletBadge">$100.00</span>
  </div>

  <div class="top-order-widget hidden" id="topOrderWidget">
    <div id="orderStatusText">Next order in: <span>02:00</span></div>
  </div>

  <div class="pinned-recipe-widget" id="pinnedRecipeWidget">
    <div class="pinned-header">
      <button class="unpin-btn" id="unpinBtn">✕</button>
    </div>
    <div class="pinned-ingredients" id="pinnedIngredientsContainer"></div>
  </div>

  <div class="screen-switcher">
    <button class="btn-action active" id="switchToAssemblyBtn" title="Assembly">🍔</button>
    <button class="btn-action" id="switchToGrillBtn" title="Grill">🍳</button>
  </div>

  <div class="mobile-top-bar">
    <button class="toggle-ui-btn" id="toggleUiBtn">👁️</button>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Модальные окна и т.д. -->
  <div class="modal-overlay" id="shopModal">
    <div class="modal-content wide">
      <div class="modal-header">
        <h3>Shop</h3>
        <button class="close-modal" id="closeShopModal">✕</button>
      </div>
      <div class="recipe-tabs" id="shopTabs">
        <button class="recipe-tab active" onclick="switchShopTab('all')">All</button>
        <button class="recipe-tab" onclick="switchShopTab('bread')">Bread</button>
        <button class="recipe-tab" onclick="switchShopTab('patty')">Patties</button>
        <button class="recipe-tab" onclick="switchShopTab('protein')">Protein</button>
        <button class="recipe-tab" onclick="switchShopTab('vegetables')">Veggies</button>
        <button class="recipe-tab" onclick="switchShopTab('sauce')">Sauces</button>
      </div>
      <div class="modal-body" id="shopModalBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="inventoryModal">
    <div class="modal-content wide">
      <div class="modal-header">
        <h3>Backpack / Stock</h3>
        <button class="close-modal" id="closeInventoryModal">✕</button>
      </div>
      <div class="recipe-tabs" id="inventoryTabs">
        <button class="recipe-tab active" onclick="switchInventoryTab('all')">All</button>
        <button class="recipe-tab" onclick="switchInventoryTab('bread')">Bread</button>
        <button class="recipe-tab" onclick="switchInventoryTab('patty')">Patties</button>
        <button class="recipe-tab" onclick="switchInventoryTab('protein')">Protein</button>
        <button class="recipe-tab" onclick="switchInventoryTab('vegetables')">Veggies</button>
        <button class="recipe-tab" onclick="switchInventoryTab('sauce')">Sauces</button>
      </div>
      <div class="modal-body" id="inventoryModalBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="recipesModal">
    <div class="modal-content wide">
      <div class="modal-header">
        <h3>Recipes & Achievements</h3>
        <button class="close-modal" id="closeRecipesModal">✕</button>
      </div>
      <div class="recipe-tabs">
        <button class="recipe-tab active" id="tabNormal" onclick="switchRecipeTab('regular')">Regular</button>
        <button class="recipe-tab" id="tabSecret" onclick="switchRecipeTab('secret')">Secret</button>
      </div>
      <div class="modal-body" id="recipesModalBody"></div>
    </div>
  </div>

  <div class="modal-overlay" id="achievementsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Achievements</h3>
        <button class="close-modal" id="closeAchievementsModal">✕</button>
      </div>
      <div class="modal-body" id="achievementsList"></div>
      <button class="btn-outline-danger" id="resetAchievementsBtn" style="margin-top: 8px;">Reset Achievements</button>
    </div>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Settings</h3>
        <button class="close-modal" id="closeSettingsModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-group">
          <label>Volume: <span id="volumeVal">100%</span></label>
          <input type="range" id="volumeRange" min="0" max="100" value="100">
        </div>
        <div class="settings-group">
          <label>Theme</label>
          <div class="settings-row">
            <button id="themeDarkBtn" class="active" onclick="setTheme('dark')">Dark</button>
            <button id="themeLightBtn" onclick="setTheme('light')">Light</button>
          </div>
        </div>
        <div class="settings-group">
          <label>Game Mode</label>
          <div class="settings-row">
            <button id="modeSandboxBtn" class="active">Sandbox</button>
            <button id="modeCasualBtn">Casual</button>
            <button id="modeTurboBtn">Turbo</button>
          </div>
        </div>
        <div class="settings-group">
          <label>Order Frequency Speed</label>
          <div class="speed-grid" id="speedButtonsGrid">
            <button class="speed-btn" data-speed="no-orders">No Orders</button>
            <button class="speed-btn" data-speed="super-fast">Super Fast</button>
            <button class="speed-btn" data-speed="fast">Fast</button>
            <button class="speed-btn active" data-speed="medium">Medium</button>
            <button class="speed-btn" data-speed="slow">Slow</button>
            <button class="speed-btn" data-speed="super-slow">Super Slow</button>
          </div>
        </div>
        <button class="btn-outline-danger" id="hardResetBtn" style="margin-top: 10px;">Wipe All Game Data</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
